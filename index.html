<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Metabolix : réviser la biochimie métabolique (UE 3.3, pharmacie Toulouse) en reconstruisant les voies sur un plan de métro.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230e1a2b%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%229%22 fill=%22none%22 stroke=%22%23ff5a5f%22 stroke-width=%224%22/%3E%3C/svg%3E">
<title>Metabolix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : réseau de métro de nuit — accueil = plan du réseau (6 lignes, 30 stations, le Carrefour au centre) ; partie = une ligne verticale parcourue par la rame, HUD collant en haut, pupitre de réponse collant en bas.
   Thème unique et assumé : bleu nuit, lignes lumineuses, panneaux blancs. */
:root{
  --bg:#0e1a2b; --bg2:#0b1524; --surface:#152439; --surface2:#1b2d47; --ink:#eef3fa; --muted:#94a6bf; --rule:#34465f;
  --glu:#ff5a5f; --glu-soft:#3a1a26; --lip:#ffc145; --lip-soft:#3a2e12; --nrj:#3ddc97; --nrj-soft:#0f372b;
  --azo:#4fb3ff; --azo-soft:#10304b; --heme:#f472d0; --heme-soft:#3a1838; --lp:#c8a27a; --lp-soft:#33291f;
  --accent:#ffffff; --sel:#9db7ff; --sel-soft:#1d2f52; --ok:#3ddc97; --ok-soft:#0f372b; --bad:#ff6b6b; --bad-soft:#3d1a22;
  --gold:#ffc145; --gold-soft:#3a2e12; --rust:#ff8a4c;
  --sign-bg:#eef3fa; --sign-ink:#0e1a2b; --band-m:#13263f; --band-c:#0e1a2b; --band-ink:#7f93ae;
  --f-ui:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:radial-gradient(1200px 600px at 70% -10%, #17304f 0%, transparent 60%), var(--bg);background-color:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
h1,h2,h3{font-family:var(--f-ui);text-wrap:balance;margin:0;line-height:1.1}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
.cta{background:var(--ink);color:var(--bg);border:0;padding:10px 18px;border-radius:10px;font-weight:800;font-size:15px}
.cta.alt{background:transparent;color:var(--ink);border:1.5px solid var(--rule)}
.cta:hover{filter:brightness(1.08)}
.bullet{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--w);color:var(--bg);font-weight:800;font-size:15px;flex:none;line-height:1}
.bullet.sm{width:22px;height:22px;font-size:11px}

/* ---------- accueil ---------- */
.top{display:grid;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--rule);margin-bottom:22px}
@media(min-width:900px){.top{grid-template-columns:minmax(0,1fr) minmax(0,420px);align-items:end}}
.logo{font-weight:800;font-size:clamp(52px,11vw,116px);line-height:.9;letter-spacing:-.03em;margin:0;display:flex;align-items:center}
.sublogo{display:inline-block;margin-top:10px;font-family:var(--f-mono);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.logo .p2{color:var(--glu)}
.logo .dotline{display:inline-block;width:.38em;height:.38em;border-radius:50%;border:.08em solid var(--ink);background:var(--bg);box-shadow:0 0 0 .07em var(--glu)}
.tagline{margin:10px 0 0;color:var(--muted);max-width:54ch}
.profile{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;display:grid;gap:10px}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.rank{font-size:30px;font-weight:800;line-height:1}
.xpbar{height:10px;background:var(--bg2);border-radius:6px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--azo),var(--sel));border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border-top:1px solid var(--rule);padding-top:8px}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1}
.stat.fire b{color:var(--rust)}
.stat.star b{color:var(--gold)}
.home{display:grid;gap:30px}
@media(min-width:1040px){.home{grid-template-columns:minmax(0,1fr) 310px;align-items:start}}
.col{display:grid;gap:30px;min-width:0}
.sect{display:grid;gap:12px;min-width:0}
.sect-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:8px}
.sect-head h2{font-size:24px;font-weight:800}
.today{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.tcard{text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px;display:grid;gap:6px;align-content:start;min-width:0}
.tcard h3{font-size:19px;font-weight:800}
.tcard.daily{border:1.5px solid var(--gold);box-shadow:0 0 22px -6px var(--gold)}
.tcard .tag2{font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
.duelist{display:flex;flex-wrap:wrap;gap:6px}
.due{border:1px solid var(--rust);color:var(--ink);background:transparent;padding:4px 9px;border-radius:999px;font-weight:600;font-size:13px}
.soon{border-style:dashed;color:var(--muted)}

/* plan du réseau */
.netwrap{overflow-x:auto;background:var(--bg2);border:1px solid var(--rule);border-radius:16px}
.net{display:block;width:100%;min-width:760px;height:auto}
.net .ln{fill:none;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.net .ln.dim{opacity:.35}
.net .glow{fill:none;stroke-width:22;stroke-linecap:round;stroke-linejoin:round;opacity:.16}
.net .stn{cursor:pointer}
.net .stn circle.r{fill:var(--bg2);stroke:var(--ink);stroke-width:4}
.net .stn.new circle.r{stroke:var(--muted);stroke-dasharray:4 3}
.net .stn.lit circle.r{fill:var(--w)}
.net .stn:hover circle.r,.net .stn:focus circle.r{stroke:var(--gold);stroke-width:5}
.net .stn text{fill:var(--ink);font-family:var(--f-ui);font-size:13px;font-weight:700;paint-order:stroke;stroke:var(--bg2);stroke-width:4px}
.net .stn text.sub{font-family:var(--f-mono);font-size:10px;font-weight:700;fill:var(--gold)}
.net .stn.new text{fill:var(--muted)}
.net .due{fill:var(--rust);stroke:var(--bg2);stroke-width:2}
.net .hubbox{fill:var(--bg2);stroke:var(--ink);stroke-width:5}
.net .boss.locked .hubbox{stroke:var(--muted);stroke-dasharray:6 4}
.net .boss text{fill:var(--ink);font-family:var(--f-ui);font-size:15px;font-weight:800;letter-spacing:.04em}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ring{display:inline-block;width:14px;height:14px;border-radius:50%;border:3px solid var(--ink)}
.legend .ring.n{border-color:var(--muted);border-style:dashed}
.legend .ring.l{background:var(--glu)}
.legend .ring.d{width:10px;height:10px;border:0;background:var(--rust)}
.worlds{display:grid;gap:24px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.vcard{text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px;display:grid;gap:7px;min-width:0;position:relative;overflow:hidden}
.vcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--w)}
.vcard:hover{border-color:var(--w)}
.vcard h3{font-size:16px;font-weight:800}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.stars{font-size:15px;letter-spacing:2px;color:var(--rule);white-space:nowrap}
.stars b{color:var(--gold)}
.mtrack{height:5px;background:var(--bg2);border-radius:3px;overflow:hidden}
.mtrack i{display:block;height:100%;background:var(--w)}
.ox{color:var(--rust);font-weight:700}
.aside{display:grid;gap:12px;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px}
@media(min-width:1040px){.aside{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}}
.aside h2{font-size:22px;font-weight:800}
.aside label{display:grid;gap:6px;font-weight:600;font-size:14px}
.aside input{font:inherit;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--bg2);color:var(--ink);width:100%}
.lb{list-style:none;margin:0;padding:0;display:grid}
.lb li{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--rule)}
.lb li .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lb li.me{background:var(--sel-soft);padding-inline:6px;margin-inline:-6px;border-radius:6px}
.lb .rk{font-family:var(--f-mono);color:var(--muted)}
.lb .pts{font-family:var(--f-mono);font-weight:700}
.note{font-size:13px;color:var(--muted);margin:0}
.badge{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border:1px solid var(--sel);color:var(--sel);border-radius:999px;font-weight:700;white-space:nowrap}
.badge.gold{border-color:var(--gold);color:var(--gold)}

/* fiche voie */
.sheetbg{position:fixed;inset:0;z-index:20;background:rgba(5,10,18,.72);display:grid;align-items:end;justify-items:center}
@media(min-width:700px){.sheetbg{align-items:center}}
.sheet{width:min(560px,100%);max-height:92vh;overflow-y:auto;background:var(--surface);border:1px solid var(--rule);border-top:5px solid var(--w);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media(min-width:700px){.sheet{border-radius:18px}}
.sheet h2{font-size:28px;font-weight:800}
.shead{display:flex;justify-content:space-between;gap:10px;align-items:start}
.stitle{display:flex;gap:10px;align-items:center}
.x{border:1px solid var(--rule);background:var(--bg2);width:36px;height:36px;border-radius:10px;font-weight:700;flex:none}
.bigstars{font-size:28px;letter-spacing:4px;color:var(--rule)}
.bigstars b{color:var(--gold)}
.diffs{display:grid;gap:8px}
.diff{text-align:left;padding:10px 12px;border:1px solid var(--rule);border-radius:12px;background:var(--bg2);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.diff b{font-size:17px;font-weight:800}
.diff span{font-size:13px;color:var(--muted);grid-column:1}
.diff em{grid-row:1/3;grid-column:2;font-style:normal;color:var(--gold);font-size:17px;letter-spacing:2px}
.diff[aria-pressed="true"]{border-color:var(--sel);background:var(--sel-soft)}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inp{padding:9px 11px;border:1px solid var(--rule);border-radius:12px;background:var(--bg2);font-weight:700;text-align:left}
.inp small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.inp[aria-pressed="true"]{border-color:var(--sel);background:var(--sel-soft)}
.recs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-size:12px}
.recs div{border-top:1px solid var(--rule);padding-top:4px}
.recs b{display:block;font-family:var(--f-mono);font-size:14px}

/* ---------- partie ---------- */
.hud{position:sticky;top:0;z-index:6;background:rgba(14,26,43,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.hud .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;gap:10px 12px;align-items:center;flex-wrap:wrap}
.hud h1{font-size:clamp(17px,4.6vw,21px);font-weight:800;flex:1 1 140px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud h1 small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.back{border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:8px;font-weight:600;font-size:14px}
.meters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;width:100%}
.hearts{font-size:19px;letter-spacing:2px;color:var(--bad);line-height:1}
.hearts .gone{color:var(--rule)}
.hearts.hit{animation:shake .35s}
.combo{font-weight:800;color:var(--muted)}
.combo.hot{color:var(--sel)}
.combo.fire{color:var(--gold);text-shadow:0 0 10px var(--gold)}
.score{font-family:var(--f-mono);font-weight:700;font-size:15px;margin-left:auto;position:relative}
.gain{position:absolute;right:0;top:-14px;font-size:12px;color:var(--ok);animation:rise .8s forwards}
.timer{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.ghost{font-family:var(--f-mono);font-size:12px;padding:1px 7px;border:1px solid var(--rule);border-radius:999px}
.ghost.ahead{color:var(--ok);border-color:var(--ok)}
.ghost.behind{color:var(--bad);border-color:var(--bad)}
.prog{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;width:100%}
.prog i{display:block;height:100%;background:var(--w);transition:width .3s;box-shadow:0 0 8px var(--w)}
.play{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:14px 30px;display:grid;gap:22px}
.board{display:grid;gap:22px;min-width:0}

/* la ligne de métro */
.ml{display:grid;min-width:0;border-radius:14px;overflow:hidden;border:1px solid var(--rule);background:var(--band-c)}
.mlhead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--rule);font-weight:800}
.band{position:relative;padding-block:6px}
.band.mito{background:var(--band-m)}
.band .zone{position:absolute;right:12px;top:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--band-ink)}
.membrane{position:relative;min-height:30px;border-top:3px double var(--band-ink);border-bottom:3px double var(--band-ink);display:flex;align-items:center;background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(127,147,174,.16) 10px 12px)}
.membrane .bar{position:absolute;left:31px;top:-3px;bottom:-3px}
.membrane span{margin-left:62px;font-size:12px;font-weight:700;color:var(--band-ink);background:var(--bg);padding:0 6px;border-radius:4px}
.row{display:grid;grid-template-columns:70px minmax(0,1fr);align-items:center;min-height:30px}
.rail{position:relative;align-self:stretch}
.bar{position:absolute;left:31px;width:9px;top:0;bottom:0;border-radius:2px;background:repeating-linear-gradient(var(--rule) 0 8px,transparent 8px 13px)}
.bar.on{background:var(--w);box-shadow:0 0 12px var(--w)}
.bar.on.anim{transform-origin:top;animation:grow .45s ease-out}
.stn .rail{min-height:44px}
.stn.first .bar{top:50%}
.stn.last .bar{bottom:50%}
.dot{position:absolute;left:21px;top:50%;width:29px;height:29px;margin-top:-14.5px;border-radius:50%;background:var(--bg);border:5px solid var(--rule);z-index:1}
.stn.done .dot{border-color:var(--w)}
.stn.bad .dot{border-color:var(--bad)}
.stn.cur .dot{border-color:var(--accent);animation:ring 1.4s infinite}
.stn.miss .dot{border-color:var(--muted)}
.nm{font-weight:800;font-size:16px;line-height:1.2;overflow-wrap:anywhere;padding:6px 10px 6px 0}
.stn.fut .nm{color:var(--muted);font-weight:700;font-size:12px;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.stn.cur .nm{color:var(--accent);font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.stn.miss .nm{color:var(--muted)}
.nm .fix,.sign .fix,.pill .fix{display:block;color:var(--ok);font-size:12px;font-weight:700}
.nm .was,.sign .was,.pill .was{text-decoration:line-through;color:var(--bad);font-weight:600}
.stn.pop .dot{animation:pop .4s ease-out}
.seg .rail{min-height:60px}
.segc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px 8px 0;min-width:0}
.sign{font-weight:700;font-size:14px;background:var(--sign-bg);color:var(--sign-ink);padding:5px 10px;border-radius:8px;max-width:100%;overflow-wrap:anywhere}
.sign.q,.pill.q{background:transparent;color:var(--muted);border:1.5px dashed var(--rule);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.sign.ask,.pill.ask{background:transparent;color:var(--accent);border:2px solid var(--accent);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;animation:ring 1.4s infinite}
.sign.bad,.pill.bad{background:var(--bad-soft);color:var(--ink);border:1.5px solid var(--bad)}
.sign.miss,.pill.miss{background:transparent;color:var(--muted);border:1.5px solid var(--rule)}
.sign.pop,.pill.pop{animation:pop .35s ease-out}
.pill{font-family:var(--f-mono);font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;border:1.5px solid var(--ink);color:var(--ink);white-space:nowrap}
.pill.loc{border-color:var(--band-ink);color:var(--band-ink)}
.train{position:absolute;left:21px;top:50%;width:29px;height:40px;margin-top:-20px;border-radius:9px 9px 6px 6px;background:var(--accent);z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:6px 5px 14px;box-shadow:0 0 16px var(--w);animation:arrive .5s ease-out}
.train i{background:var(--w);border-radius:2px}
.train::after{content:"";position:absolute;left:6px;right:6px;bottom:5px;height:3px;border-radius:2px;background:var(--bg)}
.fog{font-family:var(--f-mono);color:var(--muted);font-size:12px;padding:10px 14px 12px 62px}
.mlfoot{padding:8px 14px;border-top:1px solid var(--rule);font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* tableaux et carrefours */
.slot{display:inline-block;min-height:34px;min-width:100px;max-width:100%;padding:6px 10px;border:1.5px dashed var(--rule);border-radius:8px;color:var(--muted);overflow-wrap:anywhere;font-size:14px}
.slot.mol{border-radius:999px}
.slot.cof,.slot.loc,.slot.voie{font-family:var(--f-mono);font-size:12px;min-width:84px}
.slot.want{border:2px solid var(--accent);color:var(--accent);animation:ring 1.4s infinite}
.slot.ok{border:1.5px solid var(--ok);background:var(--ok-soft);color:var(--ink)}
.slot.bad{border:1.5px solid var(--bad);background:var(--bad-soft);color:var(--ink)}
.slot.miss{border:1.5px solid var(--rule);border-style:solid;color:var(--muted)}
.slot.pop{animation:pop .35s ease-out}
.slot .fix{display:block;font-weight:700;color:var(--ok);font-size:12px}
.slot .was{text-decoration:line-through;opacity:.75}
.ph{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.enz{font-weight:700}
.tag{font-family:var(--f-mono);font-size:12px;padding:2px 7px;border:1px solid var(--rule);border-radius:6px}
.mol{font-weight:700;padding:6px 12px;border:2px solid var(--w);border-radius:999px;max-width:100%}
.mol.fx{background:var(--wsoft)}
.gridwrap{overflow-x:auto;min-width:0;border:1px solid var(--rule);border-radius:14px}
table{border-collapse:collapse;width:100%;background:var(--surface)}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:10px 8px;border-bottom:1px solid var(--rule);color:var(--muted);white-space:nowrap;background:var(--bg2)}
td{padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:middle}
td:first-child{font-weight:700}
td .slot{min-width:96px;width:100%}
.hubs{display:grid;gap:14px}

glyco:{
 intro:"La glycolyse coupe un glucose (C6) en 2 pyruvates (C3), dans le cytosol de toutes les cellules. Trois phases : activation (−2 ATP), coupure, oxydation et récupération d'énergie (+4 ATP, +2 NADH).",

  "Une isomérase réarrange le glucose en fructose (aldose → cétose). Étape réversible, souvent oubliée : la PFK1 ne prend qu'un fructose.",
  "2ᵉ irréversible et étape clé de régulation. On obtient un sucre « super activé » prêt à être coupé. La PFK1 est inhibée par l'ATP, activée par l'AMP et surtout par le fructose-2,6-bisP (plus fort que l'ATP).",
  "L'aldolase coupe le C6 en deux C3 : le glycéraldéhyde-3-P (G3P) et la dihydroxyacétone-phosphate (DHAP).",

  "La phosphoglycérate kinase récupère le phosphate à haute énergie pour faire de l'ATP (1 par 1,3-BPG, donc 2 par glucose). Une kinase peut PRODUIRE de l'ATP.",

  "L'énolase (une déshydratase) retire une molécule d'eau : le PEP porte un phosphate à très haute énergie.",
  "3ᵉ irréversible. La pyruvate kinase transfère le phosphate du PEP sur l'ADP : ATP + pyruvate (CH₃-CO-COOH), produit final de la glycolyse."],

  "Du PEP au F1,6BP, on remonte les enzymes réversibles de la glycolyse : énolase, mutase, phosphoglycérate kinase (ATP consommé), GAPDH (NADH consommé), triose-P isomérase, aldolase.",

glycogene:{

  "Le pyruvate rentre dans la mitochondrie, et la pyruvate carboxylase refait de l'OAA (1 ATP)."],
 h:{},
 keys:["Navette citrate : l'acétyl-CoA sort, le citrate traverse, le pyruvate revient, on gagne du NADPH.","Navette malate (néoglucogenèse) : c'est l'OAA qui sort, déguisé en malate.","Synthase (citrate synthase) fabrique ; lyase (ATP-citrate lyase) coupe."]},
lipogenese:{
 intro:"Dans le cytosol du foie, du tissu adipeux et de la glande mammaire, on construit le palmitate (C16:0) 2 carbones à la fois. L'acide gras synthase (dimère, 7 activités + ACP) fait le travail.",
 x:[
  "L'acétyl-CoA carboxylase (ACC) fixe un HCO₃⁻ avec de l'ATP et de la biotine : malonyl-CoA (C3). Étape limitante et irréversible.",
  "Condensation : le malonyl (C3) se greffe sur l'amorce (C2) et perd son CO₂ : on obtient un C4 cétonique accroché à l'ACP.",
  "1ʳᵉ réduction : la cétone devient alcool, avec du NADPH.",
  "Déshydratation : on retire H et OH, une double liaison apparaît. On ne peut pas déshydrater une cétone, d'où l'ordre.",
  "2ᵉ réduction : la double liaison est saturée (NADPH). La chaîne a gagné 2 C et repart pour un tour.",
  "Après 7 tours (C16), la thioestérase détache la chaîne de l'ACP : palmitate libre. Il sera ensuite activé, allongé (élongases du RE) ou désaturé."],
 h:{},
 keys:["Palmitate : 7 tours, 7 malonyl-CoA, 7 ATP, 14 NADPH.","Cycle : condensation, réduction, déshydratation, réduction (inverse de la β-oxydation).","ACC : insuline l'active (déphosphorylée) ; glucagon et AMPK l'inactivent (phosphorylée) ; le citrate la polymérise (active).","NADPH : navette citrate (enzyme malique) et voie des pentoses."]},
tg:{
 intro:"Les triglycérides (TG) se construisent sur un squelette de glycérol-3-P, par la voie du phosphatidate. Dans l'adipocyte, ce glycérol-3-P vient du glucose.",
 x:[
  "La glycérol-3-P déshydrogénase réduit la DHAP (venue de la glycolyse) en glycérol-3-P. L'adipocyte n'a pas de glycérol kinase : il a besoin de glucose pour stocker des TG.",
  "Une acyltransférase fixe un 1ᵉʳ acide gras (acyl-CoA) : acide lysophosphatidique.",
  "Un 2ᵉ acide gras : acide phosphatidique (phosphatidate), carrefour avec les phospholipides.",
  "Une phosphatase retire le phosphate : diacylglycérol (DAG).",
  "Un 3ᵉ acide gras est estérifié : triglycéride, stocké dans les gouttelettes lipidiques."],
 h:{},
 keys:["Lipase pancréatique (intestin, colipase + sels biliaires), LPL (endothélium, ApoC-II +, ApoC-III −), LHS (adipocyte : glucagon et adrénaline +, insuline −).","LPL (enzyme) ≠ LDL (lipoprotéine).","Les lipases coupent en 1 et 3 et laissent un 2-monoglycéride."]},
phospho:{
 intro:"Les glycérophospholipides sont construits à partir du phosphatidate ou du DAG, avec un intermédiaire activé par du CTP (CDP). Les phospholipases les coupent à des endroits précis.",
 x:[],
 h:{},
 keys:["PI : on active le phosphatidate (CDP-DAG), puis on greffe l'inositol.","PC et PE : on active la tête (CDP-choline, CDP-éthanolamine), puis on la greffe sur un DAG.","PLA2 : libère l'AG en 2, souvent l'acide arachidonique, précurseur des prostaglandines.","PLC : coupe avant le phosphate (DAG + IP3). PLD : après le phosphate.","Glycérophospholipide = ester ; sphingolipide = amide ; plasmalogène = éther."]},
pip2:{
 intro:"Le PIP2 est un phospholipide de membrane (phosphatidylinositol-4,5-bisphosphate) qui sert de point de départ à deux signalisations différentes.",
 x:[
  "La phospholipase C coupe le PIP2 avant le phosphate : DAG (reste dans la membrane) + IP3 (soluble).",
  "L'IP3 se fixe sur son récepteur du réticulum endoplasmique, qui libère du Ca²⁺.",
  "Le Ca²⁺ et le DAG activent ensemble la PKC.",
  "Autre destin : la PI3K ajoute un phosphate en 3 : PIP3.",
  "Le PIP3 recrute et active AKT (PKB), comme dans la cascade insuline.",
  "AKT pousse la cellule à proliférer et survivre.",
  "PTEN est une phosphatase qui retire ce phosphate (PIP3 → PIP2). Mutée, elle laisse AKT s'emballer : c'est un suppresseur de tumeur."],
 h:{},
 keys:["PI3K fait du PIP3, PTEN freine, la PLC coupe.","La PLC fabrique l'IP3 (l'IP3 n'active pas la PLC).","Orthographe : PI3K, AKT, PTEN."]},
sphingo:{
 intro:"Les sphingolipides sont bâtis sur la sphingosine, issue de la sérine et du palmitoyl-CoA. L'acide gras y est fixé par une liaison amide.",
 x:[
  "La sérine palmitoyltransférase condense sérine + palmitoyl-CoA (avec perte de CO₂) : 3-cétosphinganine. Mnémo : « S-P-hingo ».",
  "Une réductase (NADPH) transforme la cétone en alcool : sphinganine.",
  "Une acyltransférase fixe un acide gras sur l'amine, par une liaison AMIDE : dihydrocéramide.",
  "Une désaturase crée la double liaison trans de la sphingosine : céramide, carrefour des sphingolipides.",
  "La sphingomyéline synthase transfère une phosphocholine (venue de la PC) sur le céramide : sphingomyéline, lipide des gaines de myéline."],
 h:{},
 keys:["Céramide = sphingosine + AG (amide).","Niemann-Pick : déficit en sphingomyélinase, accumulation de sphingomyéline.","Tay-Sachs : accumulation de ganglioside GM2.","Les sphingolipidoses s'accumulent dans les lysosomes, surtout du tissu nerveux."]},
chol:{
 intro:"Le cholestérol (C27) se fabrique dans le cytosol à partir d'acétyl-CoA : C2 → mévalonate (C6) → isoprène activé (C5) → squalène (C30) → lanostérol (C30) → cholestérol (C27).",
 x:[
  "Même début que la cétogenèse, mais dans le cytosol : la thiolase condense 2 acétyl-CoA.",
  "L'HMG-CoA synthase ajoute un 3ᵉ acétyl-CoA : HMG-CoA.",
  "L'HMG-CoA réductase réduit le thioester en alcool avec 2 NADPH : mévalonate. Étape limitante, irréversible, cible des statines, freinée par le cholestérol.",
  "3 kinases (3 ATP) puis une décarboxylase : on passe du C6 à l'isopentényl-PP (C5), isoprène activé très réactif.",
  "IPP + son isomère (DMAPP) se condensent : géranyl-PP (C10).",
  "Un IPP de plus : farnésyl-PP (C15). Carrefour : il sert aussi à l'ubiquinone, au dolichol et à la prénylation des protéines.",
  "La squalène synthase accole 2 farnésyl-PP avec du NADPH : squalène (C30), linéaire mais déjà replié.",
  "Une époxydase puis une cyclase ferment les 4 cycles : lanostérol (C30).",
  "Une vingtaine d'étapes (dont la Δ7-réductase) retirent 3 carbones : cholestérol (C27)."],
 h:{},
 keys:["Étape limitante : HMG-CoA RÉDUCTASE (pas synthase).","Cétogenèse dans la mitochondrie, cholestérol dans le cytosol.","ACAT (acyl-CoA, intracellulaire, stockage) ≠ LCAT (lécithine, plasma, HDL)."]},
statines:{
 intro:"Les statines inhibent l'HMG-CoA réductase. Le foie, privé de cholestérol, augmente ses récepteurs aux LDL et vide le sang de son LDL.",
 x:[
  "La statine inhibe l'HMG-CoA réductase (réductase, pas synthase).",
  "L'hépatocyte fabrique moins de cholestérol : son contenu baisse.",
  "Ce manque est détecté : SREBP quitte le réticulum endoplasmique, escorté par SCAP.",
  "Dans le Golgi, SREBP est coupé deux fois, par S1P puis S2P (les ciseaux ; SCAP n'est que l'escorte).",
  "Le fragment actif entre dans le noyau et se fixe sur les SRE de l'ADN.",
  "Il active la transcription du gène du récepteur aux LDL (et de l'HMG-CoA réductase).",
  "Plus de récepteurs, plus de LDL captées par le foie : le LDL sanguin baisse. La statine ne détruit pas le LDL."],
 h:{},
 keys:["Ordre : RE → Golgi → noyau.","Myalgies : ↓ synthèse d'ubiquinone (blocage en amont du farnésyl-PP).","HMG-CoA réductase : phosphorylée (AMPK) = inactive ; déphosphorylée (insuline) = active."]}
};
/* Vague 2 : Énergie, Azote, Hème, Lipoprotéines */
Object.assign(LESSONS, {
krebs:{
 intro:"Le cycle de Krebs (cycle du citrate) oxyde complètement l'acétyl-CoA dans la matrice mitochondriale. C'est une « usine à oxyder » : il arrache carbones (CO₂) et électrons (NADH, FADH₂) qui serviront à faire de l'ATP. C'est aussi un carrefour : ses intermédiaires servent à de nombreuses synthèses.",
 x:[
  "La citrate synthase condense l'acétyl-CoA (C2) et l'oxaloacétate (C4) en citrate (C6). 1ʳᵉ étape irréversible et point de contrôle : le cycle est freiné par l'ATP, le NADH et son produit, le citrate.",
  "L'aconitase isomérise le citrate en isocitrate (le OH change de place). Étape réversible.",
  "L'isocitrate déshydrogénase fait la 1ʳᵉ décarboxylation oxydative : un CO₂ part et un NADH est produit. 2ᵉ étape irréversible.",
  "L'α-cétoglutarate déshydrogénase fait la 2ᵉ décarboxylation oxydative : CO₂ + NADH, et on obtient un thioester riche en énergie, le succinyl-CoA. 3ᵉ irréversible. Les 2 carbones de l'acétyl-CoA sont « éliminés » en équivalent.",
  "La succinyl-CoA synthétase récupère l'énergie du thioester sous forme de GTP (converti ensuite en ATP). Réaction réversible.",
  "La succinate déshydrogénase (SDH) oxyde le succinate en fumarate et produit du FADH₂. Elle est aussi le complexe II de la chaîne respiratoire : le lien physique entre les deux.",
  "La fumarase ajoute une molécule d'eau (hydratation) : malate. Le poly écrit « déshydratation » : c'est une coquille.",
  "La malate déshydrogénase oxyde le malate en oxaloacétate avec production de NADH. L'OAA est régénéré : le cycle peut recommencer."],
 h:{0:"Hors poly : l'isocitrate déshydrogénase et l'α-cétoglutarate déshydrogénase sont activées par le Ca²⁺ et freinées par le NADH et l'ATP."},
 keys:["3 irréversibles : citrate synthase, isocitrate DH, α-cétoglutarate DH. À connaître aussi : la SDH (complexe II).","Par acétyl-CoA : 3 NADH, 1 FADH₂, 1 GTP, 2 CO₂, soit 10 ATP au total.","Carrefour (amphibolique) : citrate → AG, succinyl-CoA → hème, malate/OAA → glucose, α-KG → acides aminés.","Réaction anaplérotique type : pyruvate → OAA (pyruvate carboxylase)."]},
oxphos:{
 intro:"La chaîne respiratoire, dans la membrane interne de la mitochondrie, oxyde le NADH et le FADH₂. Les électrons vont jusqu'à l'O₂ ; l'énergie libérée sert à pomper des protons, et l'ATP synthase (complexe V) utilise ce gradient pour faire de l'ATP.",
 x:[
  "Le complexe I oxyde le NADH et reçoit 2 électrons. C'est une pompe : 4 H⁺ envoyés vers l'espace intermembranaire.",
  "Le coenzyme Q (ubiquinone), transporteur mobile et lipophile, se déplace dans la membrane et porte les électrons au complexe III.",
  "Le complexe III pompe à son tour 4 H⁺.",
  "Le cytochrome c, 2ᵉ transporteur mobile (côté espace intermembranaire), porte les électrons au complexe IV.",
  "Le complexe IV, oxydase finale, pompe 2 H⁺.",
  "Les électrons réduisent l'O₂ en H₂O : c'est la respiration. Total pour un NADH : 4 + 4 + 2 = 10 H⁺.",
  "Le FADH₂ du succinate est oxydé par le complexe II (la SDH de Krebs). Le complexe II ne traverse pas la membrane : il ne pompe aucun proton.",
  "Les électrons rejoignent le coenzyme Q, puis les complexes III et IV : seulement 6 H⁺ pour un FADH₂."],
 h:{},
 keys:["Les complexes I, III et IV pompent ; le II non. NADH : 10 H⁺ → 2,5 ATP ; FADH₂ : 6 H⁺ → 1,5 ATP.","Les H⁺ reviennent vers la matrice par l'ATP synthase, dont le rotor tourne : ADP + Pi → ATP (phosphorylation oxydative).","L'ATP ne se stocke pas : l'ATP/ADP translocase échange 1 ADP entrant contre 1 ATP sortant."]},
transam:{
 intro:"Pour dégrader un acide aminé, on enlève d'abord son NH₂. La transamination le transfère sur l'α-cétoglutarate (qui devient glutamate) ; le glutamate le libère ensuite ou le confie à la glutamine pour le transport.",
 x:[
  "L'ALAT transfère le NH₂ de l'alanine sur l'α-cétoglutarate : pyruvate + glutamate. Coenzyme : phosphate de pyridoxal. L'alanine vient des protéines musculaires, et le pyruvate part en néoglucogenèse : l'alanine est l'acide aminé le plus glucoformateur.",
  "L'ASAT fait de même avec l'aspartate, qui devient oxaloacétate (intermédiaire de Krebs et de la néoglucogenèse).",
  "La L-glutamate déshydrogénase fait une désamination oxydative : le glutamate libère son NH₂ sous forme de NH₄⁺ et redevient α-cétoglutarate, prêt à capter un nouveau NH₂.",
  "La glutamine synthétase fixe un NH₃ sur le glutamate avec 1 ATP. La glutamine porte 2 NH₂ : c'est LE transporteur d'azote de l'organisme, vers le foie (urée) ou le rein (ammoniogenèse).",
  "La glutaminase fait l'inverse, sans ATP : elle libère le NH₃ là où il doit être éliminé."],
 h:{},
 keys:["Transamination = échange du NH₂ ; désamination (GDH) = libération de NH₄⁺.","Le couple α-cétoglutarate / glutamate est le capteur commun des NH₂.","Les squelettes carbonés rejoignent Krebs ou le pyruvate : lien avec la néoglucogenèse en cas de jeûne.","L'ammoniac est très toxique : il est transporté sous forme de glutamine (et d'alanine)."]},
decarb:{
 intro:"Une décarboxylase retire le groupement COOH d'un acide aminé (départ de CO₂). Il reste une amine, souvent un médiateur très actif.",
 x:[
  "La décarboxylation du glutamate donne le GABA. Le glutamate est le principal neurotransmetteur excitateur du SNC ; le GABA, le principal inhibiteur.",
  "L'histidine décarboxylée donne l'histamine, médiateur de l'allergie et de l'inflammation.",
  "La tyrosine est d'abord hydroxylée sur son cycle : DOPA.",
  "La DOPA est décarboxylée en dopamine, précurseur de la noradrénaline, de l'adrénaline et de la mélanine.",
  "Le tryptophane est d'abord hydroxylé : 5-hydroxytryptophane.",
  "Sa décarboxylation donne la sérotonine (5-HT), impliquée dans l'humeur."],
 h:{2:"Hors poly : l'enzyme est la tyrosine hydroxylase, étape limitante de la synthèse des catécholamines.",3:"Hors poly : la L-DOPA est le traitement de référence de la maladie de Parkinson (elle passe la barrière hémato-encéphalique, pas la dopamine)."},
 keys:["Décarboxylation : on retire le COOH, il reste une amine biologiquement active.","Tyrosine et tryptophane : hydroxylation d'abord, décarboxylation ensuite.","Autres dérivés : NO (arginine, NO synthase, donne la citrulline), glutathion (glutamate + cystéine + glycine), hème (glycine + succinyl-CoA)."]},
uree:{
 intro:"L'uréogenèse (cycle de l'ornithine) se fait UNIQUEMENT dans le foie. Elle élimine 2 azotes sous une forme non toxique, l'urée, ensuite éliminée par le rein. 2 étapes dans la mitochondrie, 3 dans le cytosol.",
 x:[
  "Dans la mitochondrie, la carbamyl-phosphate synthétase I (CPS1) condense NH₃ et bicarbonate avec 2 ATP. Enzyme clé, activée par le N-acétylglutamate.",
  "L'ornithine carbamyl transférase (OCT) fixe le carbamyl sur l'ornithine : citrulline, qui sort dans le cytosol par un transporteur.",
  "Dans le cytosol, la citrulline se condense avec l'aspartate (1 ATP) : argininosuccinate. L'aspartate apporte le 2ᵉ azote.",
  "L'argininosuccinate lyase coupe la molécule : arginine + fumarate. Le fumarate repart vers le cycle de Krebs.",
  "L'arginase ajoute de l'eau et coupe l'arginine : urée + ornithine. L'ornithine retourne dans la mitochondrie : le cycle est bouclé."],
 h:{0:"Hors poly : la CPS II est cytosolique et sert à la synthèse des pyrimidines, pas à l'urée."},
 keys:["1ᵉʳ azote : NH₃ (glutamine via la glutaminase, et ammoniaque de la veine porte). 2ᵉ azote : aspartate.","Régulation : CPS1 activée par le N-acétylglutamate, dont la synthétase est activée par l'arginine (le cycle s'auto-entretient).","Facteur limitant : la glutamine (pas de stock d'acides aminés).","Urée fabriquée par le foie, éliminée par le rein. Formule de l'urée à connaître."]},
ammonio:{
 intro:"L'ammoniogenèse rénale (tube proximal) élimine environ 10 % de l'azote sous forme de NH₄⁺, et en même temps régénère du bicarbonate : c'est un système tampon du pH.",
 x:[
  "La glutamine filtrée est réabsorbée dans le tube proximal. La glutaminase libère glutamate + 1ᵉʳ NH₄⁺.",
  "La glutamate déshydrogénase libère le 2ᵉ NH₄⁺ : au total 2 NH₄⁺ éliminés par glutamine. Un des deux passe par NH₃ + H⁺ : c'est ce qui permet de moduler l'élimination des protons selon le pH.",
  "L'α-cétoglutarate, par plusieurs réactions, donne 2 HCO₃⁻ qui sont réabsorbés (et pas éliminés) : l'acidité est tamponnée."],
 h:{},
 keys:["Uréogenèse = foie (urée, ~90 % de l'azote) ; ammoniogenèse = rein (NH₄⁺, ~10 %).","En acidose : on freine l'urée et on envoie la glutamine au rein.","Production physiologique : 60 à 80 mmol de NH₄⁺ par jour."]},
purines:{
 intro:"La dégradation des bases puriques (adénine, guanine) aboutit à l'acide urique. Le prof insiste : c'est cette dégradation qu'il faut connaître.",
 x:[
  "L'AMP est déphosphorylé en adénosine. (Autre ordre possible : désamination d'abord en IMP, puis déphosphorylation.)",
  "L'adénosine est désaminée (perte d'un NH₃) : inosine.",
  "La purine nucléoside phosphorylase (PNP) retire le ribose : hypoxanthine.",
  "L'hypoxanthine est oxydée en xanthine. Carrefour : toutes les bases puriques passent par la xanthine.",
  "La xanthine oxydase (à connaître) oxyde la xanthine en acide urique, éliminé par le rein. Son accumulation donne la goutte (cristaux).",
  "Côté guanine : le GMP est déphosphorylé en guanosine.",
  "La guanosine perd son ribose : guanine.",
  "La guanine perd un NH₃ : xanthine, qui rejoint la voie commune."],
 h:{4:"Hors poly : l'allopurinol, médicament de la goutte, inhibe la xanthine oxydase."},
 keys:["Toutes les bases puriques convergent vers la xanthine ; la xanthine oxydase fait l'acide urique.","Hyperuricémie → goutte.","Synthèse : les carbones des purines viennent en partie des dérivés du folate (d'où les anti-folates) ; les pyrimidines surtout de l'aspartate."]},
hemesyn:{
 intro:"L'hème se fabrique surtout dans la moelle (85 %) et le foie (15 %), entre mitochondrie et cytosol, et sans consommer d'ATP.",
 x:[
  "Dans la mitochondrie, l'ALA synthase condense glycine et succinyl-CoA (venu de Krebs) en δ-aminolévulinate. Étape limitante, inhibée par l'hème (rétrocontrôle négatif).",
  "Dans le cytosol, 2 ALA s'associent : porphobilinogène (PBG), un monopyrrole.",
  "4 PBG se condensent et se cyclisent : uroporphyrinogène III, premier tétrapyrrole.",
  "Il est converti en coproporphyrinogène III.",
  "Le CPG III retourne dans la mitochondrie, où il est oxydé en protoporphyrinogène IX.",
  "Puis transformé en protoporphyrine IX.",
  "La ferrochélatase incorpore un Fe²⁺ : hème b. Il s'associe ensuite aux chaînes de globine."],
 h:{1:"Hors poly : l'enzyme est l'ALA déshydratase, très sensible au plomb (saturnisme).",6:"Hors poly : la ferrochélatase est aussi inhibée par le plomb."},
 keys:["Début et fin dans la mitochondrie, milieu dans le cytosol.","Aucun ATP consommé.","L'hème en excès inhibe l'ALA synthase et favorise la traduction des globines.","Défaut d'une enzyme de la voie → porphyrie (accumulation d'intermédiaires toxiques)."]},
hemecat:{
 intro:"Les hématies âgées sont détruites par les phagocytes (rate, moelle, foie). L'hème est ouvert puis transformé en pigments éliminés dans la bile : rouge, vert, jaune.",
 x:[
  "L'hème oxygénase, avec du NADPH, oxyde le fer et ouvre le cycle tétrapyrrolique (pont α) : on passe d'un cycle à une chaîne de 4 pyrroles, de couleur verte, la biliverdine. Le fer est libéré.",
  "La biliverdine réductase réduit le pont méthine central : la bilirubine, jaune. Elle est très hydrophobe et toxique pour le cerveau.",
  "Dans le sang, la bilirubine (non conjuguée) circule liée à l'albumine jusqu'au foie.",
  "Dans l'hépatocyte, elle est conjuguée à l'acide glucuronique : soluble, elle est sécrétée dans la bile.",
  "Dans l'intestin, les bactéries déconjuguent et réduisent : stercobilinogène et urobilinogène, incolores.",
  "Réoxydés, ils donnent la stercobiline (couleur des selles) et l'urobiline (couleur des urines)."],
 h:{3:"Hors poly : l'enzyme de conjugaison est l'UDP-glucuronyltransférase (UGT1A1), immature chez le nouveau-né."},
 keys:["Ecchymose : rouge (hémoglobine), bleu-vert (biliverdine), jaune (bilirubine).","L'hémoglobine libre est transportée par l'haptoglobine.","250 à 300 mg de bilirubine produits par jour ; leur accumulation donne un ictère (jaunisse du nourrisson)."]},
lpexo:{
 intro:"Les lipides alimentaires voyagent dans les chylomicrons, fabriqués par l'intestin : la voie exogène. Ce sont les lipoprotéines les plus grosses et les moins denses, très riches en TG, avec une demi-vie de 20 minutes.",
 x:[
  "L'entérocyte emballe les TG alimentaires (et un peu de cholestérol estérifié) autour de l'ApoB48, forme tronquée de l'ApoB100 : le chylomicron.",
  "Dans le sang, les HDL lui donnent de l'ApoC-II et de l'ApoE.",
  "La lipoprotéine lipase (LPL), accrochée à l'endothélium et activée par l'ApoC-II, hydrolyse les TG : les acides gras libres entrent dans les tissus (muscle, tissu adipeux).",
  "Le chylomicron appauvri en TG devient un remnant.",
  "Le remnant est capté par le foie via son ApoE (récepteur LRP), avec l'aide de la lipase hépatique."],
 h:{},
 keys:["ApoB48 = chylomicrons uniquement (intestin) ; ApoB100 = tout ce qui vient du foie (VLDL, IDL, LDL).","ApoC-II active la LPL, ApoC-III l'inhibe. ApoC-II mutée → hypertriglycéridémie.","Bilan lipidique à jeun (12 h) : les chylomicrons doivent avoir disparu."]},
lpendo:{
 intro:"Voie endogène : le foie exporte ses TG et son cholestérol dans les VLDL, qui maigrissent dans le sang jusqu'à devenir des LDL, chargées de distribuer le cholestérol aux tissus.",
 x:[
  "Le foie synthétise les VLDL : beaucoup de TG, un peu de cholestérol estérifié, ApoB100 (+ ApoC et ApoE).",
  "La LPL hydrolyse leurs TG : IDL, état intermédiaire (50 % TG, 50 % cholestérol estérifié), avec ApoB100 et ApoE.",
  "La lipase hépatique retire encore des TG : LDL, qui ne contiennent plus que du cholestérol estérifié et l'ApoB100 seule. Les IDL riches en ApoE, elles, sont vite captées par le foie.",
  "Le récepteur aux LDL reconnaît l'ApoB100 : 70 % des LDL sont captées par le foie. LDL et récepteur entrent dans la cellule, le récepteur est recyclé.",
  "La LDL est dégradée : le cholestérol libre augmente dans la cellule.",
  "Rétrocontrôle : moins de synthèse (HMG-CoA réductase ↓), moins de récepteurs aux LDL, plus de stockage par l'ACAT.",
  "Sans ApoE, les LDL sont éliminées lentement (demi-vie de 3 à 4 jours) : elles restent longtemps exposées au stress oxydant.",
  "Les AG polyinsaturés sont peroxydés et libèrent des fragments toxiques comme le malondialdéhyde (MDA).",
  "Ces fragments oxydent l'ApoB100 : elle n'est plus reconnue par le récepteur aux LDL.",
  "Les macrophages captent les LDL oxydées par leur récepteur scavenger (SR-A), qui n'a pas de rétrocontrôle.",
  "Les macrophages se gavent, deviennent spumeux, puis éclatent : inflammation et plaque d'athérome."],
 h:{},

  return out;
}

function learnLineHTML(chainIdx){
  const W = WORLDS[LR.L.w], ch = LR.L.chains[chainIdx];
  const flat = LR.steps;
  const idxs = flat.map((s,k)=>k).filter(k=>flat[k].ch===ch);
  const curK = LR.i;
  let h = `<div class="ml">${ch.label?`<div class="mlhead"><span class="bullet sm">${LETTER[LR.L.w]}</span>${esc(ch.label)}</div>`:""}`;
  let zone = ch.steps[0] && ch.steps[0].l ? ch.steps[0].l : null;
  const band = z => z ? `<div class="band ${z==="Mitochondrie"?"mito":"cyto"}"><span class="zone">${esc(z)}</span>` : `<div class="band">`;
  h += band(zone);
  const started = curK >= idxs[0];
  h += lstn(ch.start, true, false, started, curK===-1 || curK===idxs[0]-1);
  let hiddenCount = 0;
  idxs.forEach((k, j) => {
    const s = flat[k], st = s.st;
    if (k > curK){ hiddenCount++; return; }
    const z = st.l || zone;
    if (z !== zone){ h += `</div>`; if (zone && z) h += `<div class="membrane"><div class="bar on"></div><span>↕ passage à travers la membrane</span></div>`; h += band(z); zone = z; }
    const here = k===curK;
    h += `<div class="row seg${here?" here":""}"><div class="rail"><div class="bar on${here?" anim":""}"></div>${here?'<div class="train"><i></i><i></i></div>':""}</div>
      <div class="segc">${st.e?`<span class="sign">${esc(st.e)}</span>`:(!st.c&&!st.l?`<span class="pill q">signal</span>`:"")}${st.c?`<span class="pill">${esc(st.c)}</span>`:""}${st.l?`<span class="pill loc">${esc(st.l)}</span>`:""}</div></div>`;
    h += lstn(st.m, false, j===idxs.length-1, true, here);
  });
  h += `</div>`;

/* ---------- mini-quiz ---------- */
function buildQuiz(L){
  initBank();
  const qs = [], steps = lessonSteps(L);
  const enz = [...new Set(steps.map(s=>s.st.e).filter(Boolean))];
  const mols = [...new Set(steps.map(s=>s.st.m))];
  const trapsK = k => (L.traps||[]).map(norm).filter(t=>KIND[t]===k);
  const opts = (ans, pools, ctx) => { const seen = new Set([nrm(ans)]), out = [];
    for (const p of pools) for (const t of shuffle(p.slice())){ if (out.length>=3) break; const k = nrm(t); if (!k||seen.has(k)) continue; if (ctx!=null && qtyMatch(t,{ans,ctx})) continue; seen.add(k); out.push(t); }
    return shuffle(out.concat([ans])); };
  steps.forEach((s,k) => {
    const st = s.st, why = (LESSONS[L.id].x[k]) || st.w || "";
    if (st.e) qs.push({q:`${s.from} → ${st.m} : quelle enzyme ?`, a:st.e, o:opts(st.e,[trapsK("enz"),enz,GLOBAL.enz||[]]), why});
    qs.push({q:`Que devient ${s.from}${st.e?" sous l'action de "+st.e:""} ?`, a:st.m, o:opts(st.m,[trapsK("mol"),mols,GLOBAL.mol||[]]), why});
    if (st.c) qs.push({q:`${st.e||"Cette étape"} : quel cofacteur ?`, a:st.c, o:opts(st.c,[COFS]), why});
  });
  (L.grids||[]).forEach(g => g.rows.forEach((r,ri) => { for (let ci=1; ci<r.length; ci++){
    const col = g.rows.map(x=>norm(x[ci]));
    qs.push({q:`${g.cols[ci]} — ${norm(r[0])} ?`, a:norm(r[ci]), o:opts(norm(r[ci]),[col,(L.traps||[]).map(norm)],norm(r[0])), why:(g.whys||[])[ri]||""});
  }}));
  const good = qs.filter(q=>q.o.length>=3);
  // une question par étape au plus, réparties sur la voie
  shuffle(good);
  const pick = [], used = new Set();
  for (const q of good){ if (pick.length>=5) break; if (used.has(q.a)) continue; used.add(q.a); pick.push(q); }
  return pick;
}
function quizHTML(){

    ${done?`<div class="fb ${q.o[LR.pick]===q.a?"good":""}"><b>${q.o[LR.pick]===q.a?"Juste":"Raté"}</b>${q.o[LR.pick]!==q.a?`<p>La bonne réponse : <strong>${esc(q.a)}</strong>.</p>`:""}${q.why?`<p>${esc(q.why)}</p>`:""}</div>

}
function renderLearn(first){

function learnAct(a){
  if (!LR) return;
  const n = LR.steps.length;
  if (a==="home"){ LR = null; renderHome(); return; }
  if (a==="next"){ LR.i = Math.min(n, LR.i+1); }
  else if (a==="prev"){ LR.i = Math.max(-1, LR.i-1); }
  else if (a==="quiz"){ LR.qs = buildQuiz(LR.L); LR.qi = 0; LR.ok = 0; LR.pick = null; LR.phase = LR.qs.length ? "quiz" : "done"; if (!LR.qs.length) finishLesson(); }
  else if (a==="qnext"){ if (LR.qi < LR.qs.length-1){ LR.qi++; LR.pick = null; } else { finishLesson(); } }
  else if (a==="restart"){ LR.i = -1; LR.phase = "read"; }
  else if (a==="play"){ const id = LR.L.id; LR = null; renderHome(); openSheet(id); return; }
  renderLearn();
  if (a==="qnext" || a==="quiz"){ const b = app.querySelector(".opt"); if (b) b.focus({preventScroll:true}); }
}
function learnPick(i){
  if (!LR || LR.phase!=="quiz" || LR.pick!=null) return;
  LR.pick = i; if (LR.qs[LR.qi].o[i]===LR.qs[LR.qi].a) LR.ok++;
  renderLearn();
  const b = document.getElementById("qnext"); if (b) b.focus({preventScroll:true});
}
function finishLesson(){
  G.lessons = G.lessons || {};
  const prev = G.lessons[LR.L.id];
  LR.firstTime = !prev;
  LR.gain = prev ? 20 : 100;
  G.lessons[LR.L.id] = {t:Date.now(), best:Math.max(prev?prev.best:0, LR.ok), n:LR.qs.length};
  const today = dayStr();
  if (G.lastDay !== today){ const y = new Date(); y.setDate(y.getDate()-1); G.streak = (G.lastDay===dayStr(y)) ? (G.streak||0)+1 : 1; G.lastDay = today; }
  addXP(LR.gain); save();
  LR.phase = "done";
}

/* ================== SAUVEGARDE EN LIGNE (code personnel) ================== */
const CODE_ABC = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";
function newCode(){ const a = new Uint32Array(12); crypto.getRandomValues(a); const s = [...a].map(x=>CODE_ABC[x % CODE_ABC.length]).join(""); return "MTBX-"+s.slice(0,4)+"-"+s.slice(4,8)+"-"+s.slice(8,12); }
function cleanCode(t){ let s = String(t||"").toUpperCase().replace(/[^0-9A-Z]/g,""); if (s.startsWith("MTBX")) s = s.slice(4); if (s.length!==12) return null; if ([...s].some(c=>!CODE_ABC.includes(c))) return null; return "MTBX-"+s.slice(0,4)+"-"+s.slice(4,8)+"-"+s.slice(8,12); }
async function sidOf(code){ try { const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("sid:"+code)); return [...new Uint8Array(h)].slice(0,6).map(b=>b.toString(16).padStart(2,"0")).join(""); } catch(e){ return ""; } }
let SV = {msg:"", confirm:false, open:false, busy:false};
let cloudTimer = null;
async function cloudInit(){
  if (!SB) return;
  if (!G.code){ G.code = newCode(); try { localStorage.setItem(LSK, JSON.stringify(G)); } catch(e){} }
  LB.sid = await sidOf(G.code);
  try {
    const r = await SB.rpc("load_progress", {p_code:G.code});
    if (!r.error && r.data && r.data.v===1 && (r.data.updatedAt||0) > (G.updatedAt||0)){
      G = Object.assign(blank(), r.data, {code:G.code});
      try { localStorage.setItem(LSK, JSON.stringify(G)); } catch(e){}
      if (S.screen==="home") renderHome();
    }
  } catch(e){}
}

/* ================== DEVINE LA MOLÉCULE ================== */
let GQ = null, guessW = "all";
let MOLW = null;
function molWorlds(){
  if (MOLW) return MOLW;
  MOLW = {};
  LEVELS.forEach(L => (L.chains||[]).forEach(c => [c.start].concat(c.steps.map(s=>s.m)).forEach(st => (STMOL[st]||[]).forEach(k => {
    (MOLW[k] = MOLW[k] || new Set()).add(L.w); }))));
  return MOLW;
}
const guessPool = w => Object.keys(MOLS).filter(k => !MOLS[k].r && k!=="ag" && (w==="all" || (molWorlds()[k] && molWorlds()[k].has(w))));
function molAccept(k){
  const M = MOLS[k], out = new Set();
  const add = t => { const n = nrm(t); if (n) out.add(n); };
  add(M.n);
  add(M.n.replace(/\s*\(.*?\)\s*/g," "));
  const inP = M.n.match(/\(([^)]+)\)/); if (inP) add(inP[1]);
  [...out].forEach(t => { add(t.replace(/^(l|d|alpha d|beta d)\s+/,"")); });
  [...out].forEach(t => { add(t.replace(/\bphosphate\b/g,"p")); add(t.replace(/\bp\b/g,"phosphate")); add(t.replace(/^\d+ /,"")); });
  for (const st in STMOL) if (STMOL[st].length===1 && STMOL[st][0]===k){ const t = nrm(st.replace(/\s*\(.*?\)\s*/g," ")); add(t); add(t.replace(/^\d+ /,"")); add(t.replace(/\bp\b/g,"phosphate")); }
  return out;
}
function startGuess(){
  const pool = shuffle(guessPool(guessW));
  if (pool.length < 4) return;
  closeSheet(); R = null; LR = null; clearInterval(timerId);
  const n = Math.min(10, pool.length);
  GQ = {list:pool.slice(0,n), k:0, hearts:3, combo:0, best:0, pts:0, good:0, wrongs:[], typing:G.input==="clavier", pick:null, txt:null, opts:null, sugs:[], status:"play", w:guessW};
  GQ.opts = guessOpts(GQ.list[0]);
  S.screen = "guess"; renderGuess(true);
}
function fcount(f){ const o = {}; String(f||"").replace(/([A-Z][a-z]?)(\d*)/g,(m,a,n)=>{ o[a]=(o[a]||0)+(n?+n:1); return ""; }); return o; }
function fdist(a,b){ const A = fcount(MOLS[a].f), B = fcount(MOLS[b].f); let d = 0;
  for (const el of new Set(Object.keys(A).concat(Object.keys(B)))) d += Math.abs((A[el]||0)-(B[el]||0)) * (el==="H"?0.25 : el==="N"||el==="P"?2 : 1);
  return d; }
const dn = n => n.replace(/\s*\(C\d+(?::\d+)?\)/,"");
function guessOpts(k){
  const M = MOLS[k], ws = molWorlds()[k] || new Set();
  const seen = new Set([nrm(dn(M.n))]), out = [];
  const near = Object.keys(MOLS).filter(x => x!==k && !MOLS[x].r && x!=="ag")
    .map(x => [fdist(k,x) - ([...(molWorlds()[x]||[])].some(w=>ws.has(w)) ? 1.5 : 0) + Math.random()*2.5, x])
    .sort((a,b)=>a[0]-b[0]).map(p=>p[1]);
  for (const x of near){ if (out.length>=3) break; const t = dn(MOLS[x].n); if (seen.has(nrm(t))) continue; seen.add(nrm(t)); out.push(t); }
  return shuffle(out.concat([dn(M.n)]));
}
const gcur = () => GQ.list[GQ.k];
function guessAnswer(text){
  if (!GQ || GQ.status!=="play" || text==null || !String(text).trim()) return;
  const k = gcur(); GQ.txt = String(text).trim();
  const ok = GQ.typing ? molAccept(k).has(nrm(GQ.txt)) : GQ.txt===dn(MOLS[k].n);
  GQ.ok = ok;
  if (ok){ GQ.combo++; GQ.best = Math.max(GQ.best, GQ.combo); GQ.good++;
    const mult = Math.min(5, 1+Math.floor(GQ.combo/3)); GQ.gain = Math.round(10*mult*(GQ.typing?1.5:1)); GQ.pts += GQ.gain; }
  else { GQ.combo = 0; GQ.hearts--; GQ.wrongs.push({k, txt:GQ.txt}); GQ.gain = 0; }
  GQ.status = "fb"; renderGuess();
  const c = document.getElementById("gnext"); if (c) c.focus({preventScroll:true});
}
function guessNext(){
  if (!GQ) return;
  if (GQ.hearts<=0 || GQ.k >= GQ.list.length-1) return guessFinish();
  GQ.k++; GQ.status = "play"; GQ.txt = null; GQ.sugs = []; GQ.opts = guessOpts(gcur());
  renderGuess();
}
function guessFinish(){
  const won = GQ.hearts>0, perfect = won && !GQ.wrongs.length;
  GQ.bonus = won ? (perfect?60:25) : 0;
  GQ.gained = GQ.pts + GQ.bonus;
  G.molBest = G.molBest || {};
  const prev = G.molBest[GQ.w] || 0; GQ.record = GQ.gained > prev; GQ.prev = prev;
  if (GQ.record) G.molBest[GQ.w] = GQ.gained;
  const today = dayStr();
  if (G.lastDay !== today){ const y = new Date(); y.setDate(y.getDate()-1); G.streak = (G.lastDay===dayStr(y)) ? (G.streak||0)+1 : 1; G.lastDay = today; }
  addXP(GQ.gained); save();
  GQ.status = "end"; GQ.won = won; GQ.perfect = perfect;
  renderGuess(true);
}
function guessSugs(q){
  const nq = nrm(q); if (!nq) return [];
  const names = [...new Set(guessPool("all").map(k=>dn(MOLS[k].n)))];
  return names.map(t => { const n = nrm(t); const sc = n.startsWith(nq)?0 : n.includes(" "+nq)?1 : n.includes(nq)?2 : (nq.length>=4 && lev(nq,n.slice(0,nq.length))<=1)?3 : -1; return [sc,t.length,t]; })
    .filter(x=>x[0]>=0).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).slice(0,6).map(x=>x[2]);
}
function guessPicHTML(k){

}

function weekKey(d){
  let y, m, dd;
  try {
    const p = new Intl.DateTimeFormat("en-CA", {timeZone:"Europe/Paris", year:"numeric", month:"2-digit", day:"2-digit"}).format(d || new Date());
    [y, m, dd] = p.split("-").map(Number);
  } catch(e){ const x = d || new Date(); y = x.getFullYear(); m = x.getMonth()+1; dd = x.getDate(); }
  const t = Date.UTC(y, m-1, dd), wd = (new Date(t).getUTCDay()+6) % 7;
  return new Date(t - wd*864e5).toISOString().slice(0,10);
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const norm = s => String(s).trim();
const GREEK = {"α":" alpha ","β":" beta ","γ":" gamma ","δ":" delta ","Δ":" delta "};
const SUPS = {"⁺":"+","⁻":"-","¹":"1","²":"2","³":"3","ᵉ":"e","ʳ":"r"};
const nrm = t => String(t)
  .replace(/[αβγδΔ]/g, c => GREEK[c])
  .replace(/[₀-₉]/g, c => String(c.charCodeAt(0)-0x2080))
  .replace(/[⁺⁻¹²³ᵉʳ]/g, c => SUPS[c])
  .normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()
  .replace(/[^a-z0-9+]+/g," ").trim();
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[n]; }
function qty(t){
  const m = nrm(t).replace(/(\d)([a-z])/g,"$1 $2").match(/^(\d+(?: \d+)?)(?: (.+))?$/); if (!m) return null;
  const u = m[2] ? m[2].split(" ").map(w=>w.replace(/s$/,"")) : [];
  if (u.some(w=>/^\d+$/.test(w))) return null;
  return {n:m[1], u};
}
function qtyMatch(t, x){
  const a = qty(x.ans), b = qty(t); if (!a || !b || a.n!==b.n) return false;
  const ok = new Set(a.u.concat(nrm(x.ctx||"").split(" ").map(w=>w.replace(/s$/,""))));
  return b.u.every(w=>ok.has(w));
}

/* ================== CONSTRUCTION D'UNE VOIE ================== */
const PH = {enz:"enzyme", mol:"molécule", cof:"cofacteur", loc:"compartiment", voie:"voie", cell:"?"};
function buildSlots(level, mode){
  const slots=[], parts=[];
  const mk = (ans, kind, blank, why, ctx, extra) => blank
    ? (slots.push(Object.assign({id:slots.length, ans:norm(ans), kind, why, ctx, txt:null, res:null}, extra||{})), slots[slots.length-1])
    : {fixed:true, ans, kind};
  level.chains.forEach(ch => {
    let prev = ch.start;
    const steps = ch.steps.map((st,i) => {
      const ctx = (ch.label ? ch.label+", " : "") + "étape " + (i+1);
      const blankM = mode==="a" ? (!st.e && i%2===0) : true;
      const from = prev; prev = st.m;
      const qe = blankM ? `Quelle enzyme agit sur ${from} ?` : `Quelle enzyme pour ${from} → ${st.m} ?`;
      const ql = st.e ? `Dans quel compartiment agit ${st.e} ?` : `Dans quel compartiment se passe cette étape ?`;
      return {
        e: st.e ? mk(st.e,"enz",true,st.w,ctx,{q:qe}) : null,
        c: st.c ? mk(st.c,"cof",mode==="m",st.w,ctx,{q:`Quel cofacteur à cette étape${st.e?" ("+st.e+")":""} ?`}) : null,
        l: st.l ? mk(st.l,"loc",mode==="m",st.w,ctx,{q:ql}) : null,
        m: mk(st.m,"mol",blankM,st.w,ctx,{q:`Que devient ${from}${st.e?" (par "+st.e+")":""} ?`})
      };
    });
    parts.push({type:"chain", label:ch.label, start:ch.start, steps});
  });
  if (level.map){
    const M = level.map, hubIds = new Set(M.hubs.map(h=>h.id));
    const name = id => hubIds.has(id) ? M.hubs.find(h=>h.id===id).t : M.leaves[id];
    const rows = {}; M.hubs.forEach(h=>rows[h.id]=[]);
    M.edges.forEach(ed => {
      const fromHub = hubIds.has(ed.from);
      let home, partner, dir;
      if (ed.both){ home = fromHub?ed.from:ed.to; partner = fromHub?ed.to:ed.from; dir="both"; }
      else if (fromHub){ home=ed.from; partner=ed.to; dir="out"; }
      else { home=ed.to; partner=ed.from; dir="in"; }
      const lead = dir==="out" ? "part vers" : dir==="in" ? "arrive de" : "échange avec";
      const ctx = name(home)+(dir==="in"?" ← ":dir==="both"?" ⇄ ":" → ")+name(partner);
      const pHub = hubIds.has(partner);
      const pn = pHub ? null : name(partner);
      rows[home].push({dir,
        p: pHub ? {hub:partner, t:name(partner)} : mk(pn,"mol",mode!=="a",ed.w,ctx,{q:`${name(home)} ${lead} quelle molécule ?`}),
        e: mk(ed.e,"enz",true,ed.w,ctx,{q:`${ctx} : par quelle enzyme ?`}),
        v: mk(ed.v,"voie",mode==="m",ed.w,ctx,{q:`${ctx} : dans quelle voie ?`})});
      if (dir==="out" && pHub) rows[partner].push({dir:"from", hub:home, t:name(home)});
    });
    parts.push({type:"map", hubs:M.hubs, rows});
  }
  level.grids.forEach((g,gi) => {
    const rows = g.rows.map((r,ri) => r.map((cell,ci) => {
      if (ci===0) return {fixed:true, ans:cell};
      const blank = mode==="a" ? ci===r.length-1 : true;
      return mk(cell,"cell",blank,(g.whys||[])[ri],norm(r[0]),{col:gi+":"+ci, q:`${g.cols[ci]} — ${norm(r[0])} ?`});
    }));
    parts.push({type:"grid", cols:g.cols, rows});
  });
  // ordre de jeu = ordre d'affichage
  const order = [];
  const push = x => { if (x && !x.fixed) order.push(x.id); };
  parts.forEach(p => {
    if (p.type==="chain") p.steps.forEach(st => { push(st.e); push(st.c); push(st.l); push(st.m); });
    else if (p.type==="map") p.hubs.forEach(h => p.rows[h.id].forEach(r => { if (r.dir!=="from"){ if (!r.p.hub) push(r.p); push(r.e); push(r.v); } }));
    else p.rows.forEach(r => r.forEach(push));
  });
  return {slots, parts, order};
}

/* ---------- banque globale (propositions + suggestions clavier) ---------- */
let KIND = null, GLOBAL = null, BANK = null, BANKN = null, VOIES = null;
function guessKind(t){
  if (/^\d/.test(t)) return "cell";
  if (/(ase|ases)\b|kinase|synth|lyase|PFK|CPT|ACC|PEPCK|GDH|ALAT|ASAT|PTEN|PI3K|LCAT|ACAT|CETP|thiolase|isomérase|mutase/i.test(t)) return "enz";
  return "mol";
}
function initBank(){
  if (BANK) return;
  KIND = {}; GLOBAL = {}; const set = new Set();
  LEVELS.forEach(L => {
    const b = buildSlots(L,"m");
    b.slots.forEach(s => { KIND[s.ans] = KIND[s.ans] || s.kind; (GLOBAL[s.kind] = GLOBAL[s.kind] || new Set()).add(s.ans); set.add(s.ans); });
  });
  LEVELS.forEach(L => (L.traps||[]).forEach(t => { const k = norm(t); set.add(k); if (!KIND[k]) KIND[k] = guessKind(k); }));
  VOIES = [...GLOBAL.voie];
  LEVELS.forEach(L => { if (L.map) (L.map.voieTraps||[]).forEach(t => { if (!VOIES.includes(t)) VOIES.push(t); set.add(t); }); });
  COFS.concat(LOCS).forEach(t => set.add(t));
  for (const k in GLOBAL) GLOBAL[k] = [...GLOBAL[k]];
  BANK = [...set].sort((a,b)=>a.localeCompare(b,"fr")); BANKN = BANK.map(nrm);
}
function suggest(q){
  initBank(); const nq = nrm(q); if (!nq) return [];
  const out = [];
  BANK.forEach((t,i) => {
    const nt = BANKN[i]; let sc = -1;
    if (nt.startsWith(nq)) sc = 0;
    else if (nt.includes(" "+nq)) sc = 1;
    else if (nt.includes(nq)) sc = 2;
    else if (nq.length >= 4){
      const words = nt.split(" ");
      for (let k=0;k<words.length && sc<0;k++){
        const tail = words.slice(k).join(" ");
        if (lev(nq, tail.slice(0,nq.length))<=1 || lev(nq, tail.slice(0,nq.length+1))<=1 || (nq.length>=7 && lev(nq, tail.slice(0,nq.length))<=2)) sc = 3;
      }
    }
    if (sc>=0) out.push([sc, t.length, t]);
  });
  return out.sort((a,b)=>a[0]-b[0]||a[1]-b[1]).slice(0,6).map(x=>x[2]);
}
function optionsFor(s){
  initBank();
  const n = R.mode==="a" ? 2 : R.mode==="i" ? 4 : 5;
  const seen = new Set([nrm(s.ans)]), out = [];
  const take = (pool, max) => { for (const t of pool){ if (out.length>=max) break; const k=nrm(t); if (!k || seen.has(k)) continue; if (s.kind==="cell" && qtyMatch(t, s)) continue; seen.add(k); out.push(norm(t)); } };
  if (s.kind==="cell"){
    take(shuffle(R.slots.filter(x=>x.col===s.col).map(x=>x.ans)), n);
    take(shuffle((R.L.traps||[]).filter(t=>KIND[norm(t)]==="cell")), n);
    if (!out.length) take(shuffle(R.slots.filter(x=>x.kind==="cell").map(x=>x.ans)), Math.min(n,3));
  } else if (s.kind==="cof"){ take(shuffle(COFS.slice()), n); }
  else if (s.kind==="loc"){ take(LOCS.slice(), n); }
  else if (s.kind==="voie"){ take(shuffle(R.slots.filter(x=>x.kind==="voie").map(x=>x.ans)), Math.ceil(n/2)); take(shuffle(VOIES.slice()), n); }
  else {
    take(shuffle((R.L.traps||[]).filter(t=>KIND[norm(t)]===s.kind)), Math.ceil(n*0.6));
    take(shuffle(R.slots.filter(x=>x.kind===s.kind).map(x=>x.ans)), n);
    take(shuffle((GLOBAL[s.kind]||[]).slice()), n);
  }
  return shuffle(out.concat([s.ans]));
}

/* Avant l'échéance : baisse douce jusqu'à 70 % ; après : −15 % par période, plancher 25 % */
function retention(days, stab){ const k = days/Math.max(1,stab); return k<=1 ? 1-0.3*k : Math.max(0.25, 0.7*Math.pow(0.85, k-1)); }
function mastery(id){ const r = G.voies[id]; if (!r || !r.t) return 0; return Math.max(0, Math.round(r.m*retention(daysSince(r.t), r.stab||1))); }

function nextReview(id){ const r = G.voies[id]; if (!r || !r.t) return null; return Math.max(0, Math.ceil(Math.max(1,r.stab||1) - daysSince(r.t))); }
