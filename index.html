function bossUnlocked(){ return worldsStarted() >= MAIN_WORLDS.length; }
function dailyId(){
  const d = dayStr(); let h = 7; for (const c of d) h = (h*31 + c.charCodeAt(0)) % 100003;
  const pool = LEVELS.filter(l=>!l.boss); return pool[h % pool.length].id;
}
function streakNow(){ if (!G.lastDay) return 0; const y = new Date(); y.setDate(y.getDate()-1); return (G.lastDay===dayStr() || G.lastDay===dayStr(y)) ? G.streak : 0; }

/* ================== PARTIE EN DIRECT ================== */
let R = null, timerId = null, S = {screen:"home"};
const app = document.getElementById("app");
const sheetEl = document.getElementById("sheet");

function startRun(id, mode, typing){
  const L = LEVELS.find(l=>l.id===id); if (!L || (L.boss && !bossUnlocked())) return;
  closeSheet();
  const b = buildSlots(L, mode);
  const pos = {}; b.order.forEach((sid,k)=>pos[sid]=k);
  const daily = dailyId()===L.id;
  R = {L, mode, typing, slots:b.slots, parts:b.parts, order:b.order, pos, k:0,
       hearts:HEARTS(L), maxH:HEARTS(L), combo:0, bestCombo:0, pts:0, good:0, wrongs:[],
       x: MODES[mode].x * (L.boss?2:1) * (daily?2:1), daily, answered:0, typedN:0,
       t0:Date.now(), splits:[], status:"play", lastId:null, gain:null, hit:false, opts:[], sugs:[], sugIdx:-1, end:null};
  R.opts = optionsFor(cur());
  S.screen = "play";
  renderRun(true);
  clearInterval(timerId);
  timerId = setInterval(tick, 500);
}
const cur = () => R.slots[R.order[R.k]];
const ghostOf = () => { const r = G.voies[R.L.id]; return r && r.best && r.best[R.mode] && r.best[R.mode].splits; };
function comboMult(){ return Math.min(5, 1 + Math.floor(R.combo/3)); }

function tick(){
  if (!R || R.status==="end") return;
  const el = document.getElementById("timer"); if (el) el.textContent = fmtT((Date.now()-R.t0)/1000);
}

function answer(text){
  if (!R || R.status!=="play") return;
  const s = cur(); if (text==null || !String(text).trim()) return;
  s.txt = String(text).trim();
  const ok = R.typing ? (nrm(s.txt)===nrm(s.ans) || qtyMatch(s.txt,s)) : (norm(s.txt)===s.ans || (s.kind==="cell" && qtyMatch(s.txt,s)));
  s.res = ok ? "ok" : "bad";
  R.splits.push((Date.now()-R.t0)/1000);
  R.lastId = s.id;
  R.answered++; if (R.typing) R.typedN++;
  if (ok){
    R.combo++; R.bestCombo = Math.max(R.bestCombo, R.combo); R.good++;
    const mult = comboMult(); const g = Math.round(10*mult*R.x*(R.typing?1.5:1));
    R.pts += g; R.gain = {g, mult}; R.hit = false;
    advance();
  } else {
    R.combo = 0; R.hearts--; R.wrongs.push(s); R.gain = null; R.hit = true;
    R.status = R.hearts<=0 ? "lostfb" : "fb";
    renderRun();
    const c = document.getElementById("cont"); if (c) c.focus({preventScroll:true});
  }
}
function advance(){
  R.k++;
  if (R.k >= R.order.length) return finish(true);
  R.status = "play"; R.opts = optionsFor(cur()); R.sugs = []; R.sugIdx = -1;
  renderRun();
}
function proceed(){
  if (!R) return;
  if (R.status==="lostfb") return finish(false);
  if (R.status==="fb"){ R.hit=false; advance(); }
}

function finish(won){
  clearInterval(timerId);
  const L = R.L, n = R.order.length, time = (Date.now()-R.t0)/1000;
  if (!won) for (let k=R.k+1;k<R.order.length;k++){ const s = R.slots[R.order[k]]; if (!s.res) s.res = "miss"; }
  const acc = R.good/n, perfect = won && R.wrongs.length===0;
  const bonus = won ? Math.round((50 + (perfect?100:0)) * R.x * (1 + 0.5*R.typedN/Math.max(1,R.answered))) : 0;
  const gained = R.pts + bonus;
  const r = rec(L.id);
  const before = {m:mastery(L.id), stars:r.stars, rank:rankOf(G.xp)};
  // étoiles
  let st = 0; if (won){ st = MODES[R.mode].stars; if (R.mode==="m" && !perfect) st = 2; }
  const newStars = Math.max(r.stars, st);
  // maîtrise et répétition espacée
  const cap = {a:60, i:85, m:100}[R.mode];
  const score = Math.round(acc*cap*(won?1:0.6));
  const success = won && acc>=0.8;
  r.m = Math.max(before.m, score);
  r.stab = success ? (r.stab ? Math.min(90, Math.round(r.stab*2.2*10)/10) : 2) : 1;
  r.t = Date.now(); r.plays = (r.plays||0)+1; r.stars = newStars;
  // record + fantôme
  const prevBest = r.best[R.mode];
  let record = false;
  if (won && (!prevBest || gained > prevBest.pts)){ r.best[R.mode] = {pts:gained, time:Math.round(time), splits:R.splits.map(x=>Math.round(x*10)/10)}; record = true; }
  // série de jours
  const today = dayStr();
  if (G.lastDay !== today){ const y = new Date(); y.setDate(y.getDate()-1); G.streak = (G.lastDay===dayStr(y)) ? (G.streak||0)+1 : 1; G.lastDay = today; }
  addXP(gained);
  save();
  R.status = "end";
  R.end = {won, perfect, acc, bonus, gained, time, before, after:{m:mastery(L.id), stars:newStars, rank:rankOf(G.xp)}, st, record, prevBest, next:nextReview(L.id)};
  renderRun();
  const res = document.getElementById("result"); if (res && res.scrollIntoView) res.scrollIntoView({block:"start", behavior: reduced()?"auto":"smooth"});
}

/* ---------- rendu de la partie ---------- */
function isCurSlot(x){ return x && !x.fixed && R.status!=="end" && R.order[R.k]===x.id; }
function zoneOf(st){ const l = st.l; if (!l) return null; if (l.fixed) return l.ans; return l.res ? l.ans : null; }
function stnHTML(x, first, last, lit){
  let cls = "row stn"+(first?" first":"")+(last?" last":""), name;
  const cur = isCurSlot(x);
  if (x.fixed){ cls += " done"; name = esc(x.ans); }
  else if (x.res==="ok"){ cls += " done"+(x.id===R.lastId?" pop":""); name = esc(x.ans); }
  else if (x.res==="bad"){ cls += " bad"+(x.id===R.lastId?" pop":""); name = `<span class="was">${esc(x.txt)}</span><span class="fix">${esc(x.ans)}</span>`; }
  else if (x.res==="miss"){ cls += " miss"; name = esc(x.ans); }
  else if (cur){ cls += " cur"; name = "Station ?"; }
  else { cls += " fut"; name = "Station"; }
  const revealed = x.fixed || !!x.res;
  const mk = revealed && molsOf(x.ans);
  const nm = mk ? `<button class="nm molbtn" data-mol="${esc(x.ans)}" aria-label="${esc(x.ans)} : voir la structure">${name}<i class="hex" aria-hidden="true">⬡</i></button>` : `<div class="nm">${name}</div>`;
  return `<div class="${cls}" ${cur?'id="cur"':""}><div class="rail"><div class="bar ${lit?"on":""}"></div><div class="dot"></div></div>${nm}</div>`;
}
function signHTML(x, sign){
  if (!x) return "";
  const base = sign ? "sign" : "pill"+(x.kind==="loc"?" loc":"");
  if (x.fixed) return `<span class="${base}">${esc(x.ans)}</span>`;
  const pop = x.id===R.lastId ? " pop" : "";
  if (x.res==="ok") return `<span class="${base}${pop}">${esc(x.ans)}</span>`;
  if (x.res==="bad") return `<span class="${base} bad${pop}"><span class="was">${esc(x.txt)}</span><span class="fix">${esc(x.ans)}</span></span>`;
  if (x.res==="miss") return `<span class="${base} miss">${esc(x.ans)}</span>`;
  if (isCurSlot(x)) return `<span class="${base} ask" id="cur">${PH[x.kind]} ?</span>`;
  return `<span class="${base} q">${PH[x.kind]}</span>`;
}
function slotHTML(x){
  if (!x) return "";
  if (x.fixed){
    if (x.kind==="enz") return `<span class="enz">${esc(x.ans)}</span>`;
    if (x.kind==="cof"||x.kind==="loc"||x.kind==="voie") return `<span class="tag">${esc(x.ans)}</span>`;
    if (x.kind==="mol") return `<span class="mol fx">${esc(x.ans)}</span>`;
    return esc(norm(x.ans));
  }
  const isCur = isCurSlot(x);
  let cls = "slot "+x.kind, inner;
  if (x.res==="ok"){ cls += " ok"+(x.id===R.lastId?" pop":""); inner = esc(x.ans); }
  else if (x.res==="bad"){ cls += " bad"+(x.id===R.lastId?" pop":""); inner = `<span class="was">${esc(x.txt)}</span><span class="fix">${esc(x.ans)}</span>`; }
  else if (x.res==="miss"){ cls += " miss"; inner = esc(x.ans); }
  else if (isCur){ cls += " want"; inner = `<span class="ph">${PH[x.kind]} ?</span>`; }
  else inner = `<span class="ph">${PH[x.kind]}</span>`;
  return `<span class="${cls}" ${isCur?'id="cur"':""}>${inner}</span>`;
}
const fogOn = () => R.mode==="m" && R.status!=="end";
const hidden = x => x && !x.fixed && fogOn() && R.pos[x.id] > R.k;

function lineHTML(p){
  const stepSlots = st => [st.e,st.c,st.l,st.m].filter(x=>x && !x.fixed);
  const zoneOpen = z => z ? `<div class="band ${z==="Mitochondrie"?"mito":"cyto"}"><span class="zone">${esc(z)}</span>` : `<div class="band">`;
  let h = `<div class="ml">${p.label?`<div class="mlhead"><span class="bullet sm">${LETTER[R.L.w]}</span>${esc(p.label)}</div>`:""}`;
  let zone = p.steps.length ? zoneOf(p.steps[0]) : null;
  h += zoneOpen(zone);
  const firstLit = !p.steps.length || stepSlots(p.steps[0]).every(x=>x.res);
  h += stnHTML({fixed:true, ans:p.start, kind:"mol"}, true, !p.steps.length, firstLit);
  let prevLit = true, stopped = false;
  p.steps.forEach((st, i) => {
    if (stopped) return;
    const sl = stepSlots(st);
    if (sl.length && sl.every(hidden)){ h += `<div class="fog">… la suite de la ligne se dévoile station par station</div>`; stopped = true; return; }
    const z = zoneOf(st);
    if (z !== zone){
      h += `</div>`;
      if (zone && z && zone!==z) h += `<div class="membrane"><div class="bar ${prevLit?"on":""}"></div><span>↕ passage à travers la membrane</span></div>`;
      h += zoneOpen(z); zone = z;
    }
    const lit = prevLit && sl.every(x=>x.res); prevLit = lit;
    const anim = lit && sl.some(x=>x.id===R.lastId);
    const here = sl.some(isCurSlot);
    const pills = [st.c, st.l && !st.l.fixed ? st.l : null].map(x=>hidden(x)?"":signHTML(x,false)).join("");
    h += `<div class="row seg"><div class="rail"><div class="bar ${lit?"on":""}${anim?" anim":""}"></div>${here?'<div class="train"><i></i><i></i></div>':""}</div>
      <div class="segc">${st.e && !hidden(st.e) ? signHTML(st.e,true) : ""}${pills}</div></div>`;
    if (hidden(st.m)){ h += `<div class="fog">…</div>`; stopped = true; return; }
    h += stnHTML(st.m, false, i===p.steps.length-1, lit);
  });
  h += `</div>`;
  if (!stopped && p.steps.length) h += `<div class="mlfoot">Terminus</div>`;
  return h + `</div>`;
}

function boardHTML(){
  let h = "", stop = false;
  for (const p of R.parts){
    if (stop) break;
    if (p.type==="chain"){
      h += lineHTML(p);
      if (fogOn()){ const sl = p.steps.flatMap(st=>[st.e,st.c,st.l,st.m]).filter(x=>x && !x.fixed); if (sl.some(hidden)) stop = true; }
    } else if (p.type==="map"){
      h += `<div class="hubs">`;
      for (const hb of p.hubs){
        const rows = p.rows[hb.id];
        const first = rows.flatMap(r=>r.dir==="from"?[]:[r.p,r.e,r.v]).find(x=>x && !x.fixed);
        if (first && hidden(first)){ h += `<div class="fog">… d'autres correspondances t'attendent</div>`; stop = true; break; }
        h += `<section class="hub" style="--h:${WORLDS[hb.w].c}"><h3 class="hubname">${esc(hb.t)}</h3><p class="hubsub">${esc(hb.s)}</p>`;
        for (const r of rows){
          if (r.dir==="from"){ h += `<div class="route"><span class="dir">← arrive de</span><span class="hubref">${esc(r.t)}</span></div>`; continue; }
          if (hidden(r.p.hub?r.e:r.p)){ stop = true; break; }
          const lead = r.dir==="out" ? "→ part vers" : r.dir==="in" ? "← arrive de" : "⇄ échange avec";
          const partner = r.p.hub ? `<span class="hubref">${esc(r.p.t)}</span>` : slotHTML(r.p);
          h += `<div class="route"><span class="dir go">${lead}</span>${partner}<span class="dir">par</span>${hidden(r.e)?"":slotHTML(r.e)}${hidden(r.v)?"":slotHTML(r.v)}</div>`;
        }
        h += `</section>`;
        if (stop) break;
      }
      h += `</div>`;
    } else {
      h += `<div class="gridwrap"><table><thead><tr>${p.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`;
      for (const r of p.rows){
        const sl = r.filter(x=>!x.fixed);
        if (sl.length && sl.every(hidden)){ stop = true; break; }
        h += `<tr>${r.map(c=>`<td>${hidden(c)?"…":slotHTML(c)}</td>`).join("")}</tr>`;
      }
      h += `</tbody></table></div>`;
      if (stop) h += `<div class="fog">…</div>`;
    }
  }
  return h;
}

function hudHTML(){
  const W = WORLDS[R.L.w];
  const hearts = Array.from({length:R.maxH},(_,i)=>`<span class="${i<R.hearts?"":"gone"}">♥</span>`).join("");
  const mult = comboMult();
  const gh = ghostOf(); let ghost = "";
  if (gh && R.splits.length && R.status!=="end"){
    const i = R.splits.length-1;
    if (gh[i]!=null){ const d = R.splits[i]-gh[i]; ghost = `<span class="ghost ${d<=0?"ahead":"behind"}" title="Écart avec ton record">Fantôme ${d<=0?"−":"+"}${Math.abs(d).toFixed(1).replace(".",",")} s</span>`; }
  } else if (gh && R.status!=="end") ghost = `<span class="ghost">Fantôme ${fmtT(gh[gh.length-1])}</span>`;
  return `<div class="hud"><div class="in">
    <button class="back" id="quit">← Carte</button>
    <span class="bullet">${LETTER[R.L.w]}</span>
    <h1>${esc(R.L.t)}<small>Ligne ${LETTER[R.L.w]} · ${esc(W.name)} · ${MODES[R.mode].n}</small></h1>
    ${R.daily?`<span class="badge gold">Voie du jour ×2</span>`:""}
    <div class="meters">
      <span class="hearts${R.hit?" hit":""}" aria-label="${R.hearts} cœurs restants">${hearts}</span>
      <span class="combo ${mult>=4?"fire":mult>=2?"hot":""}">${R.combo>1?"Combo "+R.combo+" · ":""}×${mult}</span>
      <span class="timer" id="timer">${fmtT((Date.now()-R.t0)/1000)}</span>
      ${ghost}
      <span class="score">${R.pts} pts${R.gain?`<span class="gain">+${R.gain.g}</span>`:""}</span>
    </div>
  </div></div>`;
}

function deskHTML(){
  if (R.status==="end") return "";
  const s = cur();
  if (R.status==="fb" || R.status==="lostfb"){
    const why = s.why || R.L.tip;
    return `<div class="desk"><div class="in">
      <div class="fb"><b>${R.status==="lostfb"?"Plus de cœurs":"Raté"}</b>
        <p>Tu as répondu « ${esc(s.txt)} ». La bonne réponse : <strong>${esc(s.ans)}</strong>.</p>
        ${why?`<p>${esc(why)}</p>`:""}</div>
      <div class="fbrow"><span class="hint">${R.status==="lostfb"?"La voie s'arrête là, mais tu verras toutes les réponses dans le bilan.":"Combo remis à zéro."}</span>
      <button class="cta" id="cont">${R.status==="lostfb"?"Voir le bilan":"Continuer"}</button></div>
    </div></div>`;
  }
  const head = `<div class="qrow"><p class="q"><span class="k">${PH[s.kind]} · case ${R.k+1} / ${R.order.length}</span>${esc(s.q || s.ctx)}</p>
    <button class="swap" id="swap">${R.typing ? "Voir les propositions" : "Écrire <b>×1,5</b>"}</button></div>`;
  if (R.typing){
    return `<div class="desk"><div class="in">${head}
      <div class="sugs" id="sugs">${sugHTML()}</div>
      <div class="typerow"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Écris ta réponse" aria-label="Ta réponse"><button id="ok">OK</button></div>
    </div></div>`;
  }
  return `<div class="desk"><div class="in">${head}
    <div class="opts fresh">${R.opts.map((t,i)=>`<button class="opt" data-o="${i}"><kbd>${i+1}</kbd><span>${esc(t)}</span></button>`).join("")}</div>
  </div></div>`;
}
function sugHTML(){
  const inp = document.getElementById("ans"); const q = inp ? nrm(inp.value) : "";
  if (!R.sugs.length) return `<span class="hint">${q ? "Aucun terme du jeu ne ressemble à ça. Tu peux quand même valider." : "Écris : les suggestions viennent de tous les termes du jeu, pièges compris."}</span>`;
  return R.sugs.map((t,i)=>`<button class="sug" data-sug="${i}" aria-selected="${i===R.sugIdx}">${esc(t)}</button>`).join("");
}

function resultHTML(){
  const E = R.end; if (!E) return "";
  const W = WORLDS[R.L.w];
  const stars = [1,2,3].map(i => i<=E.after.stars ? `<b class="${i>E.before.stars?"new":""}">★</b>` : "☆").join("");
  const rk = E.after.rank > E.before.rank ? `<div class="rankup">Promotion ! Tu passes ${esc(RANKS[E.after.rank][0])}.</div>` : "";
  const seen = new Set(), whys = [];
  R.wrongs.forEach(s => { const w = s.why; if (w && !seen.has(w)){ seen.add(w); whys.push(`<li><b>${esc(s.ctx)}</b> : ${esc(w)}</li>`); } });
  const nextMode = E.won && R.mode==="a" ? "i" : E.won && R.mode==="i" ? "m" : null;
  const idx = LEVELS.indexOf(R.L); let nx = LEVELS[idx+1]; if (nx && nx.boss && !bossUnlocked()) nx = null;
  const gotTarget = E.st >= MODES[R.mode].stars;
  return `<section class="result" id="result">
    <div class="eyebrow">${E.won ? (E.perfect?"Sans faute":"Voie terminée") : "Voie échouée"} · ${R.good} / ${R.order.length} justes · ${fmtT(E.time)}${R.bestCombo>2?" · meilleur combo "+R.bestCombo:""}</div>
    <h2>${E.won ? (E.perfect?"Parfait !":"Voie complète") : "K.-O. métabolique"}</h2>
    <div class="bigstars" aria-label="${E.after.stars} étoiles sur 3">${stars}</div>
    ${E.won && R.mode==="m" && !E.perfect ? `<p class="hint">La 3ᵉ étoile se gagne en Major sans perdre un seul cœur.</p>` : ""}
    ${!E.won ? `<p class="hint">Pas d'étoile cette fois. Toutes les réponses manquantes sont affichées dans la voie, en gris.</p>` : ""}
    ${rk}
    <div class="kv">
      <div><span class="eyebrow">XP gagnée</span><b class="mono">+${E.gained}</b><span class="hint">${R.pts} en jeu${E.bonus?" + "+E.bonus+" de bonus":""}</span></div>
      <div><span class="eyebrow">Maîtrise</span><b>${E.before.m} → ${E.after.m} %</b><span class="hint">${E.next!=null?"À revoir dans "+plural(Math.max(1,E.next),"jour"):""}</span></div>
      <div><span class="eyebrow">Record ${MODES[R.mode].n}</span><b class="mono">${E.record?"Nouveau !":(E.prevBest?E.prevBest.pts:"—")}</b><span class="hint">${E.record&&E.prevBest?"Ancien : "+E.prevBest.pts:""}</span></div>
    </div>
    ${whys.length?`<div><div class="eyebrow">À retenir</div><ul>${whys.join("")}</ul></div>`:""}
    <p class="tip">${esc(R.L.tip)}</p>
    ${reportOn()?`<p class="hint"><button class="linkbtn" data-report="${esc(R.L.t)}">Une réponse te semble fausse ? Signale-la</button></p>`:""}
    <div class="acts">
      <button class="cta" data-act="again">Rejouer</button>
      ${nextMode?`<button class="cta alt" data-act="up">Passer en ${MODES[nextMode].n}</button>`:""}
      ${nx?`<button class="cta alt" data-act="next">Voie suivante</button>`:""}
      <button class="cta alt" data-act="home">Carte</button>
    </div>
  </section>`;
}

function renderRun(first){
  const W = WORLDS[R.L.w];
  const done = R.status==="end" ? R.order.length : R.k;
  app.innerHTML = `<div style="--w:${W.c};--wsoft:${W.s}">${hudHTML()}
    <main class="play">
      <div class="prog" aria-hidden="true"><i style="width:${Math.round(100*done/R.order.length)}%"></i></div>
      <p class="hint"><span class="eyebrow">${esc(W.name)}</span> · ${esc(R.L.s)}</p>
      <div class="board">${boardHTML()}</div>
      ${resultHTML()}
    </main>${deskHTML()}</div>`;
  if (R.typing && R.status==="play"){ const i = document.getElementById("ans"); let fine = false; try { fine = matchMedia("(pointer: fine)").matches; } catch(e){} if (i && (!first || fine)) i.focus({preventScroll:true}); }
  if (R.status!=="end"){
    const c = document.getElementById("cur");
    if (c && c.scrollIntoView && !first) c.scrollIntoView({block:"center", behavior: reduced()?"auto":"smooth"});
  } else if (first===true) window.scrollTo(0,0);
  if (first) window.scrollTo(0,0);
}

/* ================== ACCUEIL ================== */
function starStr(n){ return [1,2,3].map(i=>i<=n?"<b>★</b>":"☆").join(""); }
function homeHTML(){
  const rk = rankOf(G.xp), nextR = RANKS[rk+1];
  const pct = nextR ? Math.round(100*(G.xp-RANKS[rk][1])/(nextR[1]-RANKS[rk][1])) : 100;
  const daily = LEVELS.find(l=>l.id===dailyId());
  const dues = LEVELS.filter(l=>isDue(l.id)).sort((a,b)=>mastery(a.id)-mastery(b.id));
  const streak = streakNow(), playedToday = G.lastDay===dayStr();
  // mondes
  let worlds = "";
  for (const wk of MAIN_WORLDS.concat(["boss"])){
    const W = WORLDS[wk]; const lv = LEVELS.filter(l=>l.w===wk);
    worlds += `<section class="sect" style="--w:${W.c}"><div class="sect-head"><span class="bullet" style="--w:${W.c}">${LETTER[wk]}</span><h2>${esc(W.name)}</h2><span class="eyebrow">${lv.reduce((t,l)=>t+((G.voies[l.id]||{}).stars||0),0)} / ${lv.length*3} étoiles</span></div>
      <div class="wgrid">${lv.map(l => { const r=G.voies[l.id]||{}; const m=mastery(l.id); const lk = l.boss && !bossUnlocked();
        const status = lk ? `${worldsStarted()} / 6 mondes étoilés` : !r.t ? "Jamais jouée" : isDue(l.id) ? `<span class="ox">S'oxyde · à revoir</span>` : `Revoir dans ${plural(Math.max(1,nextReview(l.id)),"jour")}`;
        return `<button class="vcard" data-v="${l.id}" style="--w:${l.boss?"var(--ink)":W.c}"><h3>${esc(l.t)}</h3>
          <div class="vrow"><span class="stars">${starStr(r.stars||0)}</span><span>${m} %</span></div>
          <div class="mtrack"><i style="width:${m}%"></i></div>
          <div class="vrow"><span>${status}</span>${dailyId()===l.id?`<span class="badge gold">×2</span>`:""}</div></button>`; }).join("")}</div></section>`;
  }
  return `<div class="wrap">
    <header class="top">
      <div><h1 class="logo" aria-label="Metabolix"><span>METABO</span><span class="p2">LIX</span></h1><span class="sublogo">Biochimie · UE 3.3</span>
        <p class="tagline">Trois cœurs par voie, des combos, des étoiles, et une maîtrise qui s'oxyde si tu ne reviens pas.</p></div>
      <div class="profile">
        <div class="prow"><span class="eyebrow">Rang</span><span class="mono">${G.xp} XP</span></div>
        <div class="prow"><span class="rank">${esc(RANKS[rk][0])}</span><span class="hint">${nextR?`${nextR[1]-G.xp} XP avant ${esc(nextR[0])}`:"Rang maximum"}</span></div>
        <div class="xpbar"><i style="width:${pct}%"></i></div>
        <div class="stats">
          <div class="stat fire"><b>${streak}</b><span class="hint">jour${streak>1?"s":""} de série${streak && !playedToday?" · joue aujourd'hui pour la garder":""}</span></div>
          <div class="stat star"><b>${starsTotal()}</b><span class="hint">étoiles sur ${LEVELS.length*3}</span></div>
          <div class="stat"><b>${mastered()}</b><span class="hint">voies maîtrisées sur ${LEVELS.length}</span></div>
        </div>
      </div>
    </header>
    ${championHTML()}
    <div class="home"><div class="col">
      <section class="sect"><div class="sect-head"><h2>Aujourd'hui</h2><span class="eyebrow">${dayStr().split("-").reverse().join("/")}</span></div>
        <div class="today">
          <button class="tcard daily" data-v="${daily.id}" style="--w:${WORLDS[daily.w].c}"><span class="tag2">Voie du jour · XP ×2</span><h3>${esc(daily.t)}</h3><span class="hint">${esc(daily.s)}</span><span class="stars">${starStr((G.voies[daily.id]||{}).stars||0)}</span></button>
          <div class="tcard"><span class="eyebrow">À revoir</span><h3>${dues.length ? plural(dues.length,"voie")+" s'oxyde"+(dues.length>1?"nt":"") : "Rien à revoir"}</h3>
            ${dues.length ? `<div class="duelist">${dues.slice(0,6).map(l=>`<button class="due" data-v="${l.id}">${esc(SHORT[l.id])} · ${mastery(l.id)} %</button>`).join("")}</div>` : `<span class="hint">${Object.keys(G.voies).length ? "Tout est frais. Attaque une nouvelle voie ou vise une étoile de plus." : "Joue une première voie : elle reviendra ici quand il faudra la réviser."}</span>`}</div>
          ${learnHomeHTML()}
          ${guessHomeHTML()}
        </div></section>
      <section class="sect"><div class="sect-head"><h2>Plan du réseau</h2><span class="eyebrow">6 lignes · 30 stations · allume tout le réseau</span></div>
        <div class="netwrap">${netHTML()}</div>
        <div class="legend"><span><i class="ring n"></i>Jamais jouée</span><span><i class="ring"></i>En cours</span><span><i class="ring l"></i>Maîtrisée (70 % et plus)</span><span><i class="ring d"></i>S'oxyde : à revoir</span><span>★ étoiles · % maîtrise</span></div>
      </section>
      <div class="worlds">${worlds}</div>
    </div>
    <aside class="aside" id="lbbox"></aside></div>
    <footer class="foot"><p><button class="linkbtn" data-patch="1">v${VERSION} · notes de patch</button> · Fait par <span class="sig">floko</span> · jeu non officiel, d'après les ronéos de l'UE 3.3. Il peut contenir des erreurs : en cas de doute, c'est le cours qui fait foi.${reportOn()?` <button class="linkbtn" data-report="Général">Signaler une erreur</button>`:""}</p></footer></div>`;
}
function renderHome(){ clearInterval(timerId); S.screen="home"; R=null; LR=null; GQ=null; app.innerHTML = homeHTML(); fillChampion(); renderLB(); maybePatch(); }

/* ---------- fiche voie ---------- */
let sheetId = null;
function openSheet(id){
  const L = LEVELS.find(l=>l.id===id); if (!L) return;
  sheetId = id;
  const lk = L.boss && !bossUnlocked();
  const W = WORLDS[L.w], r = G.voies[id]||{best:{}}, m = mastery(id);
  const steps = buildSlots(L, G.mode).order.length;
  sheetEl.innerHTML = `<div class="sheetbg" id="sbg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(L.t)}" style="--w:${L.boss?"var(--ink)":W.c}">
    <div class="shead"><div><span class="eyebrow">${esc(W.name)}${dailyId()===id?" · voie du jour, XP ×2":""}</span><div class="stitle"><span class="bullet">${LETTER[L.w]}</span><h2>${esc(L.t)}</h2></div><p class="hint">${esc(L.s)}</p></div><button class="x" id="sx" aria-label="Fermer">✕</button></div>
    <div class="prow"><span class="bigstars">${starStr(r.stars||0)}</span><span class="hint">Maîtrise ${m} % · ${!r.t?"jamais jouée":isDue(id)?'<span class="ox">s\'oxyde, à revoir</span>':"à revoir dans "+plural(Math.max(1,nextReview(id)),"jour")}</span></div>
    ${lk ? `<p class="note">Le boss se débloque quand chacun des 6 mondes a au moins une étoile (${worldsStarted()} / 6).</p>` : `
    <div class="diffs">${Object.entries(MODES).map(([k,md])=>`<button class="diff" data-d="${k}" aria-pressed="${G.mode===k}"><b>${md.n} ×${md.x}</b><span>${md.d}</span><em>${"★".repeat(md.stars)}</em></button>`).join("")}</div>
    <div class="inputs">
      <button class="inp" data-in="pieces" aria-pressed="${G.input==="pieces"}">Propositions<small>Tu choisis la bonne réponse</small></button>
      <button class="inp" data-in="clavier" aria-pressed="${G.input==="clavier"}">Clavier · XP ×1,5<small>Tu l'écris, avec suggestions</small></button>
    </div>
    <div class="recs">${Object.entries(MODES).map(([k,md])=>{ const b=(r.best||{})[k]; return `<div><span class="eyebrow">${md.n}</span><b>${b?b.pts+" pts":"—"}</b><span class="hint">${b?fmtT(b.time):"pas de record"}</span></div>`; }).join("")}</div>
    <p class="hint">${plural(steps,"case")} en ${MODES[G.mode].n} · ${HEARTS(L)} cœurs${(r.best||{})[G.mode]?" · ton fantôme court avec toi":""}</p>
    <div class="golrow">${LESSONS[id]?`<button class="cta alt" data-learn="${id}">${(G.lessons||{})[id]?"Revoir la leçon":"Apprendre d'abord"}</button>`:""}<button class="cta" id="go">Jouer</button></div>`}
  </div></div>`;
  const go = document.getElementById("go"); if (go && go.focus) go.focus({preventScroll:true});
}
function closeSheet(){ sheetId = null; sheetEl.innerHTML = ""; }

/* ================== ÉVÉNEMENTS ================== */
app.addEventListener("click", e => {
  const rp = e.target.closest("[data-report]"); if (rp){ openReport(rp.dataset.report); return; }
  const mb = e.target.closest("[data-mol]"); if (mb){ openMol(mb.dataset.mol); return; }
  if (S.screen==="guess"){ guessClick(e); return; }
  if (S.screen==="learn"){ const b = e.target.closest("button"); if (!b) return; if (b.dataset.l) return learnAct(b.dataset.l); if (b.dataset.lq!==undefined) return learnPick(+b.dataset.lq); return; }
  if (S.screen==="home"){
    const sv = e.target.closest("[data-save]"); if (sv){ saveBoxAct(sv.dataset.save); return; }
    const pv = e.target.closest("[data-pv]"); if (pv){ const i = document.getElementById("pseudo"); claimPseudo(i ? i.value : G.pseudo); return; }
    const lt = e.target.closest("[data-lbt]"); if (lt){ LB.tab = lt.dataset.lbt; renderLB(); return; }
    const cq = e.target.closest("[data-cq]"); if (cq){ if (cq.dataset.cq==="edit"){ LB.qedit = true; LB.qmsg = ""; const el = document.getElementById("champ"); if (el){ el.outerHTML = championHTML(); fillChampion(); } const i = document.getElementById("cq"); if (i) i.focus(); } else setQuote(); return; }
    const pt = e.target.closest("[data-patch]"); if (pt){ openPatch(); return; }
    const gb = e.target.closest("[data-guess]"); if (gb){ startGuess(); return; }
    const gw = e.target.closest("[data-gw]"); if (gw){ guessW = gw.dataset.gw; renderHome(); return; }
    const lb = e.target.closest("[data-learn]"); if (lb){ startLesson(lb.dataset.learn); return; }
    if (e.target.closest("[data-ltoggle]")){ learnOpen = !learnOpen; renderHome(); return; }
    const t = e.target.closest("[data-v]"); if (t) openSheet(t.dataset.v); return; }
  const b = e.target.closest("button"); if (!b) return;
  if (!R) return;
  if (b.id==="quit"){ renderHome(); return; }
  if (b.id==="cont"){ proceed(); return; }
  if (b.dataset.act){
    const a = b.dataset.act, idx = LEVELS.indexOf(R.L);
    if (a==="again") startRun(R.L.id, R.mode, R.typing);
    else if (a==="up"){ const nm = R.mode==="a"?"i":"m"; G.mode = nm; save(); startRun(R.L.id, nm, R.typing); }
    else if (a==="next") startRun(LEVELS[idx+1].id, R.mode, R.typing);
    else renderHome();
    return;
  }
  if (R.status!=="play") return;
  if (b.id==="swap"){ R.typing = !R.typing; R.sugs = []; R.sugIdx = -1; renderRun(); const i = document.getElementById("ans"); if (i) i.focus({preventScroll:true}); return; }
  if (b.dataset.o!==undefined) return answer(R.opts[+b.dataset.o]);
  if (b.dataset.sug!==undefined) return answer(R.sugs[+b.dataset.sug]);
  if (b.id==="ok"){ const i = document.getElementById("ans"); return answer(R.sugIdx>=0 ? R.sugs[R.sugIdx] : i.value); }
});
sheetEl.addEventListener("click", e => {
  if (e.target.id==="sbg"){ closeSheet(); return; }
  const b = e.target.closest("button"); if (!b) return;
  if (b.id==="sx" || b.id==="sx2"){ closeSheet(); return; }
  if (b.dataset.report){ openReport(b.dataset.report); return; }
  if (b.id==="rsend"){ sendReport(); return; }
  if (b.dataset.d){ G.mode = b.dataset.d; save(); openSheet(sheetId); return; }
  if (b.dataset.in){ G.input = b.dataset.in; save(); openSheet(sheetId); return; }
  if (b.dataset.learn){ startLesson(b.dataset.learn); return; }
  if (b.id==="go") startRun(sheetId, G.mode, G.input==="clavier");
});
document.addEventListener("mousemove", () => { const f = document.querySelectorAll(".opts.fresh"); for (const x of f) x.classList.remove("fresh"); }, {passive:true});
document.addEventListener("keydown", e => {
  if (sheetId){ if (e.key==="Escape") closeSheet(); if (sheetId==="mol" || sheetId==="report" || sheetId==="patch" || e.key==="Escape") return; }
  if (S.screen==="guess" && GQ){
    if (GQ.status==="fb" && (e.key==="Enter"||e.key===" ") && e.target.id!=="gnext"){ e.preventDefault(); guessNext(); return; }
    if (GQ.status!=="play") return;
    if (e.target.id==="gans" && e.key==="Enter"){ e.preventDefault(); guessAnswer(e.target.value); return; }
    if (!GQ.typing && /^[1-4]$/.test(e.key)){ guessAnswer(GQ.opts[+e.key-1]); return; }
    return;
  }
  if (S.screen==="learn" && LR){
    if (LR.phase==="quiz" && LR.pick==null && /^[1-6]$/.test(e.key)){ learnPick(+e.key-1); return; }
    if (LR.phase==="read" && e.target===document.body && (e.key==="ArrowRight"||e.key==="ArrowLeft")){ learnAct(e.key==="ArrowRight"?"next":"prev"); return; }
    return;
  }
  if (S.screen==="home" && e.key==="Enter" && e.target.id==="pseudo"){ e.preventDefault(); claimPseudo(e.target.value); return; }
  if (S.screen==="home" && e.key==="Enter" && e.target.id==="cq"){ e.preventDefault(); setQuote(); return; }
  if (S.screen==="home" && !sheetId && (e.key==="Enter"||e.key===" ")){ const t = e.target && e.target.closest && e.target.closest("g[data-v]"); if (t){ e.preventDefault(); openSheet(t.dataset.v); return; } }
  if (!R || S.screen!=="play") return;
  if ((R.status==="fb"||R.status==="lostfb") && (e.key==="Enter"||e.key===" ") && e.target.id!=="cont"){ e.preventDefault(); proceed(); return; }
  if (R.status!=="play") return;
  if (e.target.id==="ans"){
    if (e.key==="ArrowDown"||e.key==="ArrowUp"){ if (!R.sugs.length) return; e.preventDefault(); const n=R.sugs.length; R.sugIdx = e.key==="ArrowDown"?(R.sugIdx+1)%n:(R.sugIdx<=0?n-1:R.sugIdx-1); const bx=document.getElementById("sugs"); if (bx) bx.innerHTML=sugHTML(); }
    else if (e.key==="Enter"){ e.preventDefault(); answer(R.sugIdx>=0 ? R.sugs[R.sugIdx] : e.target.value); }
    return;
  }
  if (!R.typing && /^[1-6]$/.test(e.key)){ const i = +e.key-1; if (R.opts[i]) answer(R.opts[i]); }
});
app.addEventListener("input", e => {
  if (e.target.id==="gans" && GQ){ GQ.sugs = guessSugs(e.target.value); const bx = document.getElementById("gsugs"); if (bx) bx.innerHTML = GQ.sugs.map((t,i)=>`<button class="sug" data-gs="${i}">${esc(t)}</button>`).join("") || `<span class="hint">Aucun nom du jeu ne ressemble à ça. Tu peux quand même valider.</span>`; }
  if (e.target.id==="ans" && R && R.typing){ R.sugs = suggest(e.target.value); R.sugIdx = -1; const bx = document.getElementById("sugs"); if (bx) bx.innerHTML = sugHTML(); }
  if (e.target.id==="pseudo"){ LB.pdraft = e.target.value; }
  if (e.target.id==="cq"){ LB.qdraft = e.target.value; }
});
let pseudoT = null;

/* ================== CLASSEMENT PARTAGÉ ================== */
let db = null, LB = {state:"loading", rows:null, wrows:null, tab:"week", uid:null, readOnly:false, pdraft:null, pmsg:"", pok:false, pbusy:false, qedit:false, qdraft:null, qmsg:"", qbusy:false};
function renderLB(){
  const box = document.getElementById("lbbox"); if (!box) return;
  const act = document.activeElement, aid = act && box.contains(act) ? act.id : null;
  let sel = null; try { if (aid && act.selectionStart!=null) sel = [act.selectionStart, act.selectionEnd]; } catch(e){}
  const wk = !!SB && LB.tab==="week";
  const rows = wk ? LB.wrows : LB.rows;
  let body;
  if (LB.state==="loading") body = `<p class="note">Chargement du classement…</p>`;
  else if (LB.state==="off") body = `<p class="note">Classement indisponible pour le moment. Ta progression reste enregistrée dans ce navigateur.</p>`;
  else if (!rows || !rows.length) body = `<p class="note">${wk?"Personne n'a encore marqué de points cette semaine. Le premier à jouer prend la tête !":"Personne au classement pour l'instant. Choisis un pseudo et termine une voie."}</p>`;
  else body = lbListHTML(rows);
  const tabs = SB && LB.state==="on" ? `<div class="lbtabs" role="tablist"><button data-lbt="week" aria-pressed="${wk}">Cette semaine</button><button data-lbt="all" aria-pressed="${!wk}">Général</button></div>` : "";
  box.innerHTML = `<h2>Classement</h2>${tabs}<span class="eyebrow">${wk?"XP depuis lundi · toi : "+weekXP()+" XP":"XP totale"}</span>
    ${pseudoHTML()}
    ${body}
    ${wk?`<p class="note">Remise à zéro chaque lundi à 0 h. Le n°1 devient champion 👑 de la semaine suivante.</p>`:""}
    ${LB.readOnly && LB.state==="on" ? `<p class="note">Tu peux voir le classement mais pas y publier ton score avec ton accès actuel.</p>` : ""}
    <p class="note">Rangs : ${RANKS.map(r=>esc(r[0])).join(" → ")}.</p>${saveBoxHTML()}`;
  if (rows) box.querySelectorAll("[data-who]").forEach(el => { el.textContent = rows[+el.dataset.who].pseudo || "Anonyme"; });
  if (aid){ const el = document.getElementById(aid); if (el){ if (act.value!=null && el.value!==undefined) el.value = act.value; el.focus({preventScroll:true}); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch(e){} } }
}
let saving = Promise.resolve();
let SB = null;
async function sbTop(){
  if (!SB) return;
  await sbWeekly();
  const r = await SB.from("scores").select("id,pseudo,xp,sid").order("xp",{ascending:false}).limit(60);
  if (r.error){ LB.state = "off"; }
  else {
    const seen = new Set(), rows = [];
    for (const x of r.data){ const k = x.sid || x.id; if (seen.has(k)) continue; seen.add(k); rows.push({id:x.id, sid:x.sid||"", pseudo:String(x.pseudo||"").slice(0,20), xp:Math.round(+x.xp||0)}); if (rows.length>=30) break; }
    LB.rows = rows; LB.state = "on";
  }
  if (S.screen==="home") renderLB();
}
function saveRemote(){
  if (SB && LB.uid){
    cloudSave();
    const body = {id:LB.uid, sid:LB.sid||"", pseudo:(G.pseudo||"").slice(0,20), xp:Math.min(5000000,Math.max(0,Math.round(G.xp))), stars:starsTotal(), rank:RANKS[rankOf(G.xp)][0], updated_at:new Date().toISOString()};
    const wxp = weekXP();
    saving = saving.then(()=>SB.from("scores").upsert(body)).then(r=>{ if (r && r.error) console.warn(r.error.message); })
      .then(()=> wxp>0 ? SB.from("weekly").upsert({week:weekKey(), uid:LB.uid, sid:LB.sid||"", pseudo:(G.pseudo||"").slice(0,20), xp:Math.round(wxp)}, {onConflict:"week,uid"}) : null)
      .then(r=>{ if (r && r.error) console.warn(r.error.message); return sbTop(); }).catch(()=>{});
    return;
  }
  if (!db || !LB.uid || LB.readOnly) return;
  const body = {pseudo:G.pseudo||"", xp:G.xp, stars:starsTotal(), rank:RANKS[rankOf(G.xp)][0], updatedAt:G.updatedAt, state:G};
  saving = saving.then(()=>db.doc("scores/"+LB.uid).set(body)).catch(err => { if (err && err.code==="invalid_argument"){ LB.readOnly = true; renderLB(); } });
}
(async () => {
  try {
    const C = window.GP_CONFIG || {};
    if (C.supabaseUrl && C.supabaseKey && window.supabase && window.supabase.createClient){
      SB = window.supabase.createClient(C.supabaseUrl, C.supabaseKey);
      let s = (await SB.auth.getSession()).data.session;
      if (!s){ const r = await SB.auth.signInAnonymously(); if (r.error) throw r.error; s = r.data.session; }
      LB.uid = s.user.id;
      await cloudInit();
      if (G.pseudo && !G.pseudoOk) await claimPseudo(G.pseudo, true);
      await sbChampion(); setInterval(sbChampion, 3600000);
      await sbTop(); setInterval(sbTop, 60000);
      if (G.xp>0) saveRemote(); else renderLB();
      return;
    }
    if (!window.claude || !window.claude.use){ LB.state="off"; renderLB(); return; }
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if (!d){ LB.state="off"; renderLB(); return; }
    db = d;
    LB.uid = u ? await u.id() : null;
    if (u){ const can = await u.can("data.write"); if (can===false) LB.readOnly = true; }
    if (!LB.uid) LB.readOnly = true;
    if (LB.uid){
      try {
        const mine = await db.doc("scores/"+LB.uid).get();
        if (mine.exists){ const m = mine.data(); if (m.state && m.state.v===1 && (m.state.updatedAt||0) > (G.updatedAt||0)){ G = Object.assign(blank(), JSON.parse(JSON.stringify(m.state))); try { localStorage.setItem(LSK, JSON.stringify(G)); } catch(e){} if (S.screen==="home") renderHome(); } }
      } catch(e){}
    }
    db.collection("scores").orderBy("xp","desc").limit(30).onSnapshot(snap => {
      LB.rows = snap.docs.map(x => ({id:x.id, pseudo:String(x.data().pseudo||"").slice(0,20), xp:Math.round(+x.data().xp||0)}));
      LB.state = "on"; if (S.screen==="home") renderLB();
    }, () => { LB.state="off"; if (S.screen==="home") renderLB(); });
  } catch(e){ SB = null; LB.state="off"; renderLB(); }
})();

renderHome();
</script>
